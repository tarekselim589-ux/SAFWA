<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safwa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B5770">
<title>Safwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#EEF5F6; --card:#FFFFFF; --water:#0B5770; --deep:#073B4C; --ink:#0F2A33; --muted:#5B7680;
  --rope-r:#D23B3B; --rope-y:#F2C230; --good:#1E8A5A; --bad:#C0392B; --line:#D3E3E7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --tile:#06222C; --card:#0B2F3B; --water:#4FB3D1; --deep:#9FD8E8; --ink:#E4F2F5; --muted:#8FB0BA;
  --rope-r:#F06262; --rope-y:#F2C230; --good:#4CC38A; --bad:#FF7B6B; --line:#1C4756;
}}
:root[data-theme="dark"]{
  --tile:#06222C; --card:#0B2F3B; --water:#4FB3D1; --deep:#9FD8E8; --ink:#E4F2F5; --muted:#8FB0BA;
  --rope-r:#F06262; --rope-y:#F2C230; --good:#4CC38A; --bad:#FF7B6B; --line:#1C4756;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--tile);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header{padding:16px 0 10px}
.brand{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;font-size:24px;line-height:1.2;margin:0;color:var(--deep)}
.brand small{display:block;font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:500;font-size:14px;color:var(--muted)}
.rope{height:6px;border-radius:3px;margin:10px 0 0;
  background:repeating-linear-gradient(90deg,var(--rope-r) 0 14px,#fff 14px 20px,var(--water) 20px 34px,#fff 34px 40px)}
h2{font-family:"Reem Kufi",sans-serif;font-weight:500;font-size:19px;margin:22px 0 10px;color:var(--deep)}
.meet{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--deep);color:var(--tile);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.meet b{font-family:"Reem Kufi",sans-serif;font-size:26px;line-height:1}
.meet span{font-size:14px;opacity:.85}
.more{background:none;border:0;color:var(--water);font-weight:600;font-size:14px;padding:4px 0}
h3{font-size:16px;margin:0 0 4px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rope-y);outline-offset:2px}
.btn{background:var(--water);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
:root[data-theme="dark"] .btn{color:#06222C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06222C}}
:root[data-theme="dark"] .btn.ghost{color:var(--water)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--water)}}
.btn.ghost{background:transparent;color:var(--water);border:1.5px solid var(--water)}
.btn.small{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lanes{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.lane{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:0;border-bottom:2px dashed var(--line);padding:12px 12px}
.lane:last-child{border-bottom:0}
.lane:hover{background:color-mix(in srgb,var(--water) 6%,transparent)}
.lnum{font-family:"Reem Kufi",sans-serif;font-size:22px;color:var(--water);text-align:center}
.lname{font-weight:600}
.lmeta{font-size:14px;color:var(--muted)}
.trend{font-size:14px;font-weight:600;white-space:nowrap;direction:ltr}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px;flex:1;min-width:130px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--tile)}
input.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 16px -10px rgba(0,0,0,.25)}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;line-height:1.5;padding:4px 2px;border-radius:10px}
.tabbar i{display:block;font-size:20px;font-style:normal;line-height:1.2}
.tabbar button[aria-current="true"]{color:var(--water)}
.card{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card b{display:block;font-size:17px;color:var(--deep)}
.card span{font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--rope-y);color:#3B2C00;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.warn{display:flex;gap:8px;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--rope-r);margin-bottom:8px;font-size:15px}
.warn.soft{border-right-color:var(--rope-y)}
.warn.tip{border-right-color:var(--water);background:color-mix(in srgb,var(--water) 6%,var(--card))}
.cardwrap .sheet{background:#fff;color:#0E1B2E;border-radius:12px;padding:18px 16px;margin-bottom:14px;border:1px solid #E1E9F4}
.crel{position:relative}
.crib{display:inline-block;background:#2563C7;color:#fff;font-style:italic;font-weight:700;font-size:11.5px;padding:3px 11px 4px;
  clip-path:polygon(2% 6%,97% 0,100% 88%,99% 100%,4% 97%,0 14%)}
.crib.big{font-size:26px;padding:5px 18px 7px}
.cteam{font-weight:700;color:#0E1B2E;font-size:13px;letter-spacing:1.2px;margin:7px 0 0}
.csub{color:#6B7A8C;font-size:12px;margin:3px 0 0}
.ctag{display:inline-block;background:#FDF4F4;color:#D23B3B;font-weight:700;font-size:11px;border-radius:999px;padding:2px 9px;margin-top:6px}
.crope{height:14px;margin:9px 0;background:
  radial-gradient(circle at 7px 7px,#0E1B2E 5.5px,transparent 6.5px) 0 0/95px 14px repeat-x,
  radial-gradient(circle at 7px 7px,#2563C7 5.5px,transparent 6.5px) 0 0/19px 14px repeat-x,
  linear-gradient(#0E1B2E,#0E1B2E) 0 6px/100% 1.5px repeat-x}
.cdry{background:#F3F7FD;border-radius:9px;padding:8px 11px;margin:3px 0 4px;font-size:12px;line-height:1.7}
.cdry b{color:#2563C7}
.cblk{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #E1E9F4;break-inside:avoid}
.cblk:last-of-type{border-bottom:0}
.cnum{font-family:"Reem Kufi";font-weight:700;font-style:italic;font-size:22px;color:#C3D8F5;line-height:1}
.cdist{font-family:"Reem Kufi";font-weight:700;font-size:13px;color:#2563C7;margin-top:3px}
.cbody{font-size:12.5px;line-height:1.72;margin-top:3px}
.ctotal{display:flex;justify-content:space-between;align-items:center;background:#2563C7;color:#fff;padding:9px 14px;margin-top:9px;
  clip-path:polygon(1% 5%,99% 0,100% 93%,99% 100%,1% 96%,0 8%)}
.ctotal span{font-weight:700;font-size:12px;letter-spacing:.8px}
.ctotal b{font-family:"Reem Kufi";font-size:22px;font-style:italic}
.ch3{font-family:"Reem Kufi";font-weight:500;font-size:15px;margin:12px 0 4px;color:#0E1B2E}
.cp,.cul li{font-size:12.8px;line-height:1.8;margin:0;color:#0E1B2E}
.cul{margin:0;padding-inline-start:18px}
.cwarn{border-inline-start:4px solid #D23B3B;background:#FDF4F4;padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.7;margin-top:9px}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff}
  .nav,.tabbar,.toast,header,.noprint{display:none !important}
  .wrap{padding:0;max-width:none}
  .cardwrap .sheet{border:0;border-radius:0;padding:0;margin:0}
  .cardwrap .sheet.print+.sheet.print{break-before:page}
}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-family:"Reem Kufi",sans-serif;font-size:20px;color:var(--water);text-align:center}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font:inherit;color:inherit}
.rowbtn:last-of-type{border-bottom:0}
.rowbtn:active{background:color-mix(in srgb,var(--water) 7%,transparent)}
@media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--tile);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.issue{border-right:5px solid var(--rope-r);padding:10px 14px;margin-bottom:10px;background:var(--card);border-radius:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.issue.ok{border-right-color:var(--good)}
.issue p{margin:2px 0 8px;color:var(--muted);font-size:15px}
.drill{margin:6px 0 0;padding:8px 10px;background:var(--tile);border-radius:8px;font-size:15px}
.drill b{color:var(--deep)}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .t{direction:ltr;font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:14px}
.back{background:none;border:0;color:var(--water);font-weight:600;padding:0;margin-top:16px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.ai{white-space:pre-wrap;font-size:15px;margin-top:10px}
.toast{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;margin-bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--deep);color:var(--tile);padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.askov{position:fixed;inset:0;z-index:60;background:rgba(7,59,76,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.askbox{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.askbox p{margin:0 0 16px;font-weight:600;line-height:1.7}
.askbox .row{gap:8px;justify-content:flex-end}
.btn.bad{background:var(--bad)}
.note{font-size:14px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.pm-bar{height:10px;background:var(--tile);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.pm-bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.pm-set{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;color:var(--ink);font:inherit}
.pm-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pm-t{font-size:21px;font-weight:700;line-height:1.4}
.pm-d{font-size:20px;font-weight:700;color:var(--water);direction:ltr;white-space:nowrap}
.pm-l{display:block;font-size:20px;line-height:1.9;margin-top:4px}
.pm-n{display:block;font-size:19px;font-weight:700;margin-top:10px;color:var(--deep)}
.pm-set.done{opacity:.5;border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--card))}
.pm-set.done .pm-t::before{content:"✓ ";color:var(--good)}
.wm{position:fixed;inset:0;z-index:4;pointer-events:none;background:var(--logo) center 46%/min(82vw,560px) auto no-repeat;opacity:.055}
:root[data-theme="dark"] .wm{opacity:.07;filter:brightness(1.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{opacity:.07;filter:brightness(1.9)}}
@media print{.wm{display:none}}
.imgov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;padding:16px}
.imgov img{width:100%;display:block;margin:0 0 12px;background:#fff;border-radius:8px}
.imgov p{color:#fff;margin:0 0 10px}
</style>
<style>
[hidden]{display:none!important}
.lgov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--tile,#f2f5f9);color:var(--ink,#111)}
.lgbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;background:var(--card,#fff);border:1px solid var(--line,#dbe3ec);border-radius:16px;padding:22px}
.lgbox #lgFields{display:flex;flex-direction:column;gap:12px}
.lgbox #lgFields[hidden]{display:none}
.lgt{margin:0;font-weight:700;font-size:20px;text-align:center}
.lgl{margin:0;text-align:center;opacity:.7}
.lgf{display:flex;flex-direction:column;gap:4px;font-size:13px;opacity:.9}
.lgf input{font:16px inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#dbe3ec);background:transparent;color:inherit}
.lgerr{margin:0;color:#c0392b;font-size:14px;text-align:center}
.migr{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}
.migr .askbox p{margin:0 0 14px}
.outbtn{display:block;margin:18px auto 8px;background:none;border:1px solid var(--line,#ccc);color:inherit;opacity:.75;border-radius:9px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wm" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1 class="brand">Safwa Team <small>أرقام السباحين، تقدمهم، وإيه اللي محتاج شغل</small></h1>
    <div class="rope" aria-hidden="true"></div>
  </header>
  <main id="app"><p class="empty">بيحمّل…</p></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="أقسام البرنامج"></nav>
<div class="toast" id="toast" role="status"></div>
<div id="lg" class="lgov">
  <form id="lgForm" class="lgbox" novalidate>
    <p class="lgt">تسجيل الدخول</p>
    <p class="lgl" id="lgLoad">لحظة…</p>
    <div id="lgFields" hidden>
      <label class="lgf">الإيميل<input id="lgEmail" type="email" autocomplete="username" inputmode="email" dir="ltr"></label>
      <label class="lgf">الباسورد<input id="lgPass" type="password" autocomplete="current-password" dir="ltr"></label>
      <button class="btn" type="submit" id="lgBtn">دخول</button>
      <p class="lgerr" id="lgErr" hidden></p>
    </div>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection as fCol, doc as fDoc, onSnapshot as fSnap, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCLxD-fduSa6kgqnk8pJj8HwtzY3AYfhIg",authDomain:"tarek-74842.firebaseapp.com",projectId:"tarek-74842",storageBucket:"tarek-74842.firebasestorage.app",messagingSenderId:"179196785540",appId:"1:179196785540:web:d4604f645dbbcc6e5f23d1"});
const auth=getAuth(app);
let fs; try{ fs=initializeFirestore(app,{localCache:persistentLocalCache()}); }catch(e){ fs=initializeFirestore(app,{}); }
const P=p=>"safwa_"+p;
const wrap=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
const FS={
  collection:p=>({
    onSnapshot:(n,e)=>fSnap(fCol(fs,P(p)),s=>n({docs:s.docs.map(wrap)}),e),
    add:async d=>{const r=await addDoc(fCol(fs,P(p)),d);return {id:r.id};}
  }),
  doc:p=>({
    set:d=>setDoc(fDoc(fs,P(p)),d), update:d=>updateDoc(fDoc(fs,P(p)),d), delete:()=>deleteDoc(fDoc(fs,P(p))),
    onSnapshot:(n,e)=>fSnap(fDoc(fs,P(p)),s=>n(wrap(s)),e)
  })
};
window.FB={FS,auth,signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),signOut:()=>signOut(auth)};
onAuthStateChanged(auth,u=>{ window.FB.user=u; window.dispatchEvent(new CustomEvent("fbauth",{detail:u})); });

function normDigits(s){return String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,".").trim();}
function parseTime(s){
  s=normDigits(s); if(!s) return null;
  let m=s.match(/^(\d+)[:.](\d{1,2})[:.](\d{1,2})$/);            // 1.24.93 أو 1:24:93 أو 1:24.93
  if(m) return +m[1]*60 + +m[2] + +("0."+m[3]);
  m=s.match(/^(\d+):(\d+(?:\.\d+)?)$/); if(m) return +m[1]*60+ +m[2];  // 1:24.93
  m=s.match(/^\d+(?:\.\d+)?$/); return m? +s : null;                    // 38.71
}
function fmt(t){ if(t==null||isNaN(t)) return "—";

const evName=k=>{const [d,s,p]=k.split("|");return d+"م "+STROKES[s]+(p&&p!=="20"?` · حمام ${p}`:"");};
function askConfirm(msg){
  return new Promise(res=>{
    const ov=document.createElement("div"); ov.className="askov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    ov.innerHTML=`<div class="askbox"><p></p><div class="row"><button class="btn ghost" data-a="0">لأ</button><button class="btn bad" data-a="1">أيوه، امسح</button></div></div>`;
    ov.querySelector("p").textContent=msg;
    const done=v=>{ov.remove();res(v);};
    ov.addEventListener("click",e=>{const b=e.target.closest("button[data-a]"); if(b){e.stopPropagation();done(b.dataset.a==="1");} else if(e.target===ov) done(false);});
    document.body.appendChild(ov);
  });
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
const byDate=(a,b)=>(a.date||"").localeCompare(b.date||"")||(a.at||0)-(b.at||0);

function saveLocal(){try{localStorage.setItem("safwa",JSON.stringify({swimmers:state.swimmers,results:state.results,goals:state.goals,meet:state.meet,bench:state.bench,meets:state.meets}));}catch(e){}}
const store={
  async addSwimmer(s){ if(db){await db.collection("swimmers").add(s);} else {state.swimmers.push({id:"s"+Date.now(),...s});saveLocal();render();} },
  async addResult(r){ if(db){await db.collection("results").add(r);} else {state.results.push({id:"r"+Date.now(),...r});saveLocal();render();} },

  async setGoal(g){ const id=g.swimmer+"_"+g.dist+"_"+g.stroke+"_"+(g.pool||20)+"_"+(g.tier||"self");

  async delGoal(id){ if(db){await db.doc("goals/"+id).delete();} else {state.goals=state.goals.filter(x=>x.id!==id);saveLocal();render();} },

/* ---------- analysis ---------- */
const DRILLS={
  free:[["Catch-up","دراع يستنى التاني قدام قبل ما يبدأ الشد — بيطوّل الضربة ويصلّح التوقيت."],["Fingertip drag","سحب أطراف الصوابع على المية في الرجوع — بيرفع الكوع ويخلي الرجوع مريح."],["6-3-6","6 ضربات رجل على الجنب، 3 ضربات دراع، وتكرر — للدوران والتنفس."]],
  back:[["Single-arm back","دراع واحد والتاني جنب الجسم — بيركّز على دخول الإيد والشد العميق."],["Cup on forehead","كوباية بلاستيك على الجبهة — الراس ثابتة والجسم يلف حواليها."],["6-kick switch","6 ضربات رجل على الجنب ثم تبديل — لدوران الكتف."]],
  breast:[["2 kicks 1 pull","ضربتين رجل مع شدة واحدة — بتقوّي الرجل والانسياب."],["Pull + dolphin kick","شد صدر مع رجل دولفين — بيصلّح توقيت الشد وسرعته."],["Glide count","يعد 2 في الانسياب بعد كل ضربة — بيقلل عدد الضربات."]],
  medley:[["ترتيب التحويلات",`تمرين التحويل بين الأنواع: 4×(25 فراشة + 25 ظهر) براحة قصيرة — أضعف جزء في المتنوع هو التحويل.`],["IM Pace",`100 متنوع مقسومة 4×25 بوقت السباق، راحة 15ث.`],["أضعف نوع",`شغل زيادة على النوع اللي بيضيّع فيه وقت في المتنوع.`]],
  fly:[["3-3-3","3 دراع يمين، 3 شمال، 3 كاملين — للإيقاع والتوقيت."],["Single-arm fly","دراع واحد بالتنفس على الجنب — بيبني الإيقاع من غير إرهاق."],["Underwater dolphin","رجل دولفين تحت المية بعد الدفعة لحد 10م — أسرع جزء في السباق."]]
};
const PACE=s=>[["سرعة السباق",`8×20 ${s} بسرعة السباق، راحة 30ث — ويعد ضرباته.`],["Broken",`100 ${s} مقسومة 5×20 براحة 10ث، والوقت الكلي يتسجّل.`],["Negative split",`6×40 ${s}، الـ20 التانية أسرع من الأولى.`]];
const EFF=s=>[["DPS",`6×20 ${s} بأقل عدد ضربات ممكن بدون ما الوقت يزيد.`],["Swim golf",`وقت الـ20م + عدد الضربات = سكور، ويحاول يقلله كل مرة.`]];
const d2=a=>a.map(([n,h])=>({name:n,how:h}));

/* ---------- تمارين التطوير (لكل سباح) ---------- */
const DEV_DOSE=" المسافة: 6×20، راحة 20ث.";
function strokeGaps(sw){
  const g={};
  entriesOf(sw).forEach(k=>{ const [d,st,p]=k.split("|"), best=bestOf(sw.id,+d,st,+p), b=benchFor(sw,{dist:+d,stroke:st,pool:+p});
    if(best==null||!b||!b.third) return;
    const pct=(best/b.third-1)*100;
    if(!g[st]||pct>g[st].pct) g[st]={pct,txt:`${d}م ${STROKES[st]}: ${fmt(best)} مقابل الثالث ${fmt(b.third)}`}; });
  return g;
}
function devDrills(sw){
  const out=[], seen=new Set();
  const add=(name,how,why)=>{ if(out.length>=4||seen.has(name)) return; seen.add(name); out.push({name,how,why}); };
  analyze(sw).issues.forEach(i=>{ const d=i.drills&&i.drills[0]; if(d) add(d.name,d.how,i.title); });
  const dose=st=>st==="medley"?"":DEV_DOSE;
  Object.entries(strokeGaps(sw)).sort((a,b)=>b[1].pct-a[1].pct).forEach(([st,g])=>{
    (DRILLS[st]||[]).slice(0,2).forEach(d=>add(d[0],d[1]+dose(st),`أكبر فرق عن الثالث في ${STROKES[st]} (${g.txt})`)); });
  const sts=[...new Set([...(sw.strokes||[]),...entriesOf(sw).map(k=>k.split("|")[1])])].filter(x=>DRILLS[x]);
  const main=sts.filter(x=>x!=="free"); (main.length?main:(sts.length?sts:["free"])).forEach(st=>
    (DRILLS[st]||[]).slice(0,2).forEach(d=>add(d[0],d[1]+dose(st),`نوعه الأساسي: ${STROKES[st]}`)));
  return out;
}
function devCard(sw){
  const L=devDrills(sw); if(!L.length) return "";
  return `<h2>تمارين التطوير</h2><div class="panel">
    <p class="note" style="margin:0 0 6px">التمارين اللي تركّز عليها معاه، بتتحدّث لما أرقامه ونقاط ضعفه تتغير.</p>
    ${L.map(d=>`<div class="drill"><b>${esc(d.name)}:</b> ${esc(d.how)}<br><span class="lmeta">ليه: ${esc(d.why)}</span></div>`).join("")}</div>`;
}
function eventsOf(rs){
  const g={}; rs.forEach(r=>{(g[evKey(r)]=g[evKey(r)]||[]).push(r);});
  return Object.entries(g).map(([k,list])=>{
    list.sort(byDate);
    const times=list.map(r=>r.t), best=Math.min(...times), first=times[0], latest=times[times.length-1];
    return {key:k,list,best,first,latest,n:list.length,change:(first-latest)/first*100,
      bestIdx:times.lastIndexOf(best)};
  }).sort((a,b)=>b.n-a.n);
}
function analyze(sw){
  const rs=state.results.filter(r=>r.swimmer===sw.id);
  const evs=eventsOf(rs), issues=[];
  evs.forEach(e=>{
    const [d,s]=e.key.split("|"), sn=STROKES[s];
    if(e.n>=2 && e.latest>e.best*1.03)
      issues.push({key:e.key,title:`رجوع في ${evName(e.key)}`,detail:`آخر وقت ${fmt(e.latest)} أبطأ من أحسن وقت ${fmt(e.best)} بـ${((e.latest/e.best-1)*100).toFixed(1)}%. ممكن تعب أو حمل زيادة — راجع النوم والحمل الأسبوع ده.`,drills:d2(PACE(sn).slice(0,1))});
    else if(e.n>=4 && e.bestIdx<e.n-3)
      issues.push({key:e.key,title:`ثبات في ${evName(e.key)}`,detail:`مفيش رقم جديد في آخر 3 قياسات. محتاج تغيير في المثير: تكنيك + سرعة سباق.`,drills:d2([DRILLS[s][0],PACE(sn)[1]])});
    const sp=e.list.filter(r=>r.first&&r.second).slice(-3);
    if(sp.length){
      const fade=sp.reduce((a,r)=>a+(r.second-r.first)/r.first,0)/sp.length*100;
      if(fade>10) issues.push({key:e.key,title:`بيقع في النص التاني — ${evName(e.key)}`,detail:`النص التاني أبطأ بمتوسط ${fade.toFixed(0)}%. المشكلة توزيع مجهود وتحمّل سرعة.`,drills:d2(PACE(sn))});
    }
    const sc=e.list.filter(r=>r.sc>0);
    if(sc.length>=3){
      const last=sc[sc.length-1].sc, prev=sc.slice(0,-1).reduce((a,r)=>a+r.sc,0)/(sc.length-1);
      if(last-prev>=2) issues.push({key:e.key,title:`ضرباته زادت في ${sn}`,detail:`آخر عدد ${last} ضربة/طول مقابل متوسط ${prev.toFixed(1)}. الكفاءة بتقل — الضربة بقت أقصر.`,drills:d2([...EFF(sn),DRILLS[s][0]])});
    }
  });
  // weakest stroke vs squad, same distance
  const rel={};
  evs.forEach(e=>{
    const [d,s,p]=e.key.split("|");
    const others=state.swimmers.filter(o=>o.id!==sw.id&&(o.sex||"m")===(sw.sex||"m")).map(o=>{
      const b=state.results.filter(r=>r.swimmer===o.id&&r.dist==d&&r.stroke===s&&(r.pool||20)==p).map(r=>r.t);
      return b.length?Math.min(...b):null;}).filter(x=>x);
    if(others.length>=2){const avg=others.reduce((a,b)=>a+b,0)/others.length;(rel[s]=rel[s]||[]).push(e.best/avg);}
  });
  const rk=Object.entries(rel).map(([s,v])=>[s,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>b[1]-a[1]);
  if(rk.length>=2 && rk[0][1]-rk[rk.length-1][1]>0.04){
    const s=rk[0][0];
    issues.push({gen:true,title:`أضعف نوع مقارنة بالفريق: ${STROKES[s]}`,detail:`الفرق بينه وبين متوسط الفريق في ${STROKES[s]} أكبر من باقي أنواعه. يستاهل زيادة تكنيك فيه.`,drills:d2(DRILLS[s])});
  }
  return {rs,evs,issues};
}

/* ---------- views ---------- */
function trendHtml(sw){
  const {evs}=analyze(sw); const e=evs.find(x=>x.n>=2);
  if(!e) return `<span class="trend flat">${evs.length?"قياس واحد":"مفيش أرقام"}</span>`;
  const c=e.change, cls=c>0.3?"up":c<-0.3?"down":"flat";
  return `<span class="trend ${cls}">${c>0?"−":"+"}${Math.abs(c).toFixed(1)}%</span>`;
}

function prevOf(r,pool){
  return pool.filter(x=>x.swimmer===r.swimmer&&x.stroke===r.stroke&&x.dist==r.dist&&(x.pool||20)==(r.pool||20)&&x.id!==r.id&&byDate(x,r)<0).sort(byDate).pop();
}
function diffHtml(now,old){
  if(!old) return `<span class="flat">أول مرة</span>`;
  const d=now-old, pc=Math.abs(d)/old*100, cls=d<-0.005?"up":d>0.005?"down":"flat";
  return `<span class="${cls}" style="direction:ltr;display:inline-block">${d<0?"−":"+"}${Math.abs(d).toFixed(2)} ث (${pc.toFixed(1)}%)</span>`;
}
function keepRace(){
  const c=state.race; if(!c) return; const d=state.rdraft=state.rdraft||{};
  for(let i=0;i<c.n;i++){ const st=$("#x-st-"+i), ds=$("#x-d-"+i), tt=$("#x-t-"+i), rk=$("#x-r-"+i);
    if(!tt) continue; d["st"+i]=st.value; d["d"+i]=ds.value; d["t"+i]=tt.value.trim(); d["r"+i]=(rk?.value||"").trim(); }
}

function keepLog(){

      E=[ln(a,40,`${se} build`),ln(b,20,drn),ln(c,20,`${se} short speed`)];

    notes:parts.flatMap(p=>[`— ${p.sn} (${p.v}م):`,...p.notes]), vol};

async function sheetPng(m){
  const lg=await new Promise(r=>{ try{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=LOGO; }catch(e){ r(null); } });
  const W=1080, PAD=56, FF=(getComputedStyle(document.body).fontFamily)||"Tahoma, Arial, sans-serif";
  const C={water:"#0B5770",deep:"#073B4C",ink:"#0F2A33",muted:"#5B7680",line:"#D3E3E7",chip:"#2B63C9"};
  const cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const wrap=(txt,font,maxW)=>{ ctx.font=font; const words=String(txt).split(" "), L=[]; let cur="";
    for(const w of words){ const t=cur?cur+" "+w:w; if(ctx.measureText(t).width>maxW&&cur){ L.push(cur); cur=w; } else cur=t; }
    if(cur) L.push(cur); return L; };
  const rope=(y,draw)=>{ if(draw){ ctx.strokeStyle=C.deep; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
      let i=0; for(let x=PAD+8;x<=W-PAD-8;x+=28,i++){ ctx.fillStyle=i%5===0?C.deep:C.chip; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.fill(); } } };
  const run=draw=>{ let y=PAD; ctx.direction="ltr"; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    if(draw){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,cv.height);
      if(lg){ const ww=W*.8, hh=ww*lg.height/lg.width; ctx.globalAlpha=.06; ctx.drawImage(lg,(W-ww)/2,Math.max(PAD,(cv.height-hh)/2),ww,hh); ctx.globalAlpha=1; } }
    ctx.font=`italic 800 66px ${FF}`; const tw=ctx.measureText("TRAINING").width;
    if(draw){ ctx.fillStyle=C.chip; ctx.fillRect(PAD,y,tw+64,100); ctx.fillStyle="#fff"; ctx.fillText("TRAINING",PAD+32,y+72); }
    if(draw&&lg){ const lw=250, lh=lw*lg.height/lg.width; ctx.drawImage(lg,W-PAD-lw,y+50-lh/2,lw,lh); }
    y+=100+34;
    wrap(m.team,`700 32px ${FF}`,W-2*PAD).forEach(l=>{ if(draw){ ctx.fillStyle=C.ink; ctx.font=`700 32px ${FF}`; ctx.fillText(l,PAD,y+28); } y+=42; });
    y+=4;
    wrap(m.sub,`400 26px ${FF}`,W-2*PAD).forEach(l=>{ if(draw){ ctx.fillStyle=C.muted; ctx.font=`400 26px ${FF}`; ctx.fillText(l,PAD,y+24); } y+=36; });
    y+=18; rope(y,draw); y+=40;
    const TX=PAD+176, MW=W-PAD-TX;
    m.blocks.forEach(b=>{ const y0=y;
      if(b.label){ ctx.font=`700 22px ${FF}`; const cw=ctx.measureText(b.label).width+30;
        if(draw){ ctx.fillStyle=C.chip; ctx.fillRect(TX,y,cw,38); ctx.fillStyle="#fff"; ctx.font=`700 22px ${FF}`; ctx.fillText(b.label,TX+15,y+27); }
        y+=38+14; }
      b.lines.forEach((ln,i)=>{ const ind=ln.ind?30:0, font=`${ln.b?700:400} 29px ${FF}`; if(ln.b&&i>0) y+=12;
        wrap(ln.t,font,MW-ind).forEach(l=>{ if(draw){ ctx.fillStyle=ln.b?C.deep:C.ink; ctx.font=font; ctx.fillText(l,TX+ind,y+28); } y+=42; }); });
      if(draw){ ctx.fillStyle="rgba(11,87,112,.35)"; ctx.font=`italic 800 46px ${FF}`; ctx.fillText(String(b.n).padStart(2,"0"),PAD,y0+40);
        if(b.dist){ ctx.fillStyle=C.water; ctx.font=`700 28px ${FF}`; ctx.fillText(b.dist+" m",PAD,y0+88); } }
      y=Math.max(y,y0+110)+16;
      if(draw){ ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); }
      y+=22; });
    if(m.total){ y+=6; rope(y,draw); y+=34;
      if(draw){ ctx.fillStyle=C.chip; ctx.fillRect(PAD,y,W-2*PAD,96); ctx.fillStyle="#fff"; ctx.font=`700 28px ${FF}`; ctx.fillText("TOTAL DISTANCE",PAD+32,y+60);
        ctx.font=`italic 800 48px ${FF}`; ctx.textAlign="right"; ctx.fillText(m.total.toLocaleString("en")+" m",W-PAD-32,y+66); ctx.textAlign="left"; }
      y+=96; }
    return y+PAD; };

}

async function restore(txt){
  let d; try{d=JSON.parse(txt);}catch(e){toast("الملف مش مقروء");return;}
  if(!d||!Array.isArray(d.swimmers)){toast("الملف مش نسخة احتياطية");return;}
  let added=0;
  const ex=new Set(state.swimmers.map(s=>s.id)), er=new Set(state.results.map(r=>r.id)), eg=new Set(state.goals.map(g=>g.id));
  try{
    for(const s of d.swimmers){ if(ex.has(s.id)) continue; const {id,...rest}=s; await store.put("swimmers",id,rest); added++; }
    for(const r of (d.results||[])){ if(er.has(r.id)) continue; const {id,...rest}=r; await store.put("results",id,rest); added++; }
    for(const g of (d.goals||[])){ if(eg.has(g.id)) continue; const {id,...rest}=g; await store.put("goals",id,rest); added++; }
    const em=new Set(state.meets.map(m=>m.id));
    for(const m of (d.meets||[])){ if(em.has(m.id)) continue; const {id,...rest}=m; await store.saveMeet(rest,id); added++; }
    const eb=new Set(state.bench.map(b=>b.id));
    for(const b of (d.bench||[])){ if(eb.has(b.id)) continue; const {id,...rest}=b; await store.saveBench(rest,id); added++; }
    if(d.meet&&!state.meet) await store.setMeet(d.meet);
    toast(added?`اترجّع ${added} صف`:"كل حاجة موجودة بالفعل");
  }catch(e){toast("حصلت مشكلة في الاسترجاع، جرّب تاني");}
  render();
}

}

function liveCapture(e){
  const t=e.target; if(!t||!t.id&&!t.classList) return;
  let by=/^y-(st|d|f|th)-(\d+)$/.exec(t.id||"");
  if(by){ state.bdraft=state.bdraft||{}; state.bdraft[by[1]+by[2]]=t.value; return; }
  let lg=/^g-sw-(\d+)$/.exec(t.id||"");
  if(lg){ state.draft=state.draft||{}; state.draft["sw"+lg[1]]=t.value; return; }
  lg=/^g-(st|d|t)-(\d+)-(\d+)$/.exec(t.id||"");
  if(lg){ state.draft=state.draft||{}; state.draft[`${lg[1]}${lg[2]}_${lg[3]}`]=t.value; return; }
  const m=/^x-(st|d|t|r)-(\d+)$/.exec(t.id||"");
  if(m){ state.rdraft=state.rdraft||{}; state.rdraft[({st:"st",d:"d",t:"t",r:"r"})[m[1]]+m[2]]=t.value; return; }

  if(t.id==="lDate"){ if(state.log) state.log.date=t.value||state.log.date; }
}

        const same=state.results.filter(o=>o.swimmer===r.swimmer&&o.stroke===r.stroke&&o.dist==r.dist&&(o.pool||20)==20);

    for(let k=ri;k<c.groups[gi]-1;k++){ ["st","d","t"].forEach(f=>{ d[`${f}${gi}_${k}`]=d[`${f}${gi}_${k+1}`]; }); }

  if(t.dataset.rmgrp){keepLog();const gi=+t.dataset.rmgrp,c=state.log,d=state.draft,nd={};
    let g=0; c.groups.forEach((n,i)=>{ if(i===gi) return;

async function askAi(){
  const sw=state.swimmers.find(s=>s.id===state.sel); if(!sw) return;
  const key=state.event; if(!key) { toast("اختار سباق الأول"); return; }
  const slot=sw.id+"|"+key; if(state.ai[slot]?.busy) return;
  const [dS,stroke,pS]=key.split("|"), dist=+dS, pool=+pS;
  const rs=state.results.filter(r=>r.swimmer===sw.id&&r.stroke===stroke&&r.dist==dist&&(r.pool||20)==pool).sort(byDate);
  const {issues}=analyze(sw);
  const mine=issues.filter(i=>i.key===key).map(i=>i.title);
  const b=benchFor(sw,{dist,stroke,pool});
  const gls=state.goals.filter(g=>g.swimmer===sw.id&&g.stroke===stroke&&g.dist==dist&&(g.pool||20)==pool);
  const pred=predictRace(sw.id,stroke,dist,pool);
  const nm=meetOf(sw).m;
  const data=rs.map(r=>`${r.date} | ${fmt(r.t)}${r.first?` | splits ${fmt(r.first)}/${fmt(r.second)}`:""}${r.sc?` | ${r.sc} strokes/20m`:""}${r.kind==="race"?` | race ${r.note||""}${r.rank?` rank ${r.rank}`:""}`:" | training"}`).join("\n");
  const prompt=`You are an experienced age-group swim coach. Training pool is 20 m.
Swimmer: ${sw.name}, born ${sw.year||"?"}, ${sw.sex==="f"?"girl":"boy"}, age group ${ageOf(sw)||"?"}.
ANALYSE ONE EVENT ONLY: ${dist} m ${stroke} in a ${pool} m pool. Ignore every other event.
His times in this event (date | time | extras):
${data||"(none)"}
${pred!=null?`Predicted from his 20 m pool training: ${fmt(pred)}.`:""}
${b?`Age-group reference in this event: 1st ${b.first?fmt(b.first):"-"}, 3rd ${b.third?fmt(b.third):"-"}.`:"No age-group reference recorded."}
${gls.length?`Saved targets: ${gls.map(g=>`${g.label||"هدف"} ${fmt(g.target)}`).join(", ")}.`:""}
${nm?`Next meet: ${nm.name||"meet"} in ${daysTo(nm.start)} days.`:""}
Rule-based flags for this event: ${mine.join("; ")||"none"}.
Write in Egyptian Arabic, short and practical, plain text (no markdown, no tables, no headers with #).
1) أهم 2-3 حاجات في السباق ده بالتحديد مع السبب من الأرقام.
2) 4 تمارين محددة بأزمنة محسوبة من رقمه، مناسبة لحمام 20م (اكتب المسافة والعدد والراحة والوقت المستهدف).
3) هدف وقت واقعي للقياس الجاي في نفس السباق.
Keep it under 180 words.`;
  state.ai[slot]={busy:true,text:""}; render();
  try{
    await sample(prompt,{onText:({text})=>{ state.ai[slot].text=text;
      if(state.sel===sw.id&&state.event===key&&state.view==="swimmer"){const el=document.querySelector(".ai"); if(el) el.textContent=text; else render();} }});
  }catch(e){ if(!state.ai[slot].text) state.ai[slot].text= e.code==="rate_limited"?"طلبات كتير، استنى شوية وجرّب.":"التحليل مااشتغلش المرة دي."; }
  state.ai[slot].busy=false; render();
}

}
window.addEventListener("fbauth",e=>{
  if(e.detail){ $("#lg").hidden=true; startCloud(); }
  else { if(STARTED){location.reload();return;} showLogin(); }
});
setTimeout(()=>{ if(!STARTED&&!window.FB) showLogin(); },8000);
if(window.FB&&("user" in window.FB)){ if(window.FB.user){ $("#lg").hidden=true; startCloud(); } else showLogin(); }
$("#lgForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const er=$("#lgErr"), btn=$("#lgBtn"), em=$("#lgEmail").value.trim(), pw=$("#lgPass").value; er.hidden=true;
  if(!em||!pw){er.textContent="اكتب الإيميل والباسورد";er.hidden=false;return;}
  if(!window.FB){er.textContent="مفيش نت، اتأكد من الاتصال";er.hidden=false;return;}
  btn.disabled=true; btn.textContent="بيدخل…";
  try{ await window.FB.signIn(em,pw); $("#lgPass").value=""; }
  catch(x){ const c=x&&x.code||""; er.textContent=c.includes("too-many")?"محاولات كتير، استنى شوية":c.includes("network")?"مفيش نت، اتأكد من الاتصال":"الإيميل أو الباسورد غلط"; er.hidden=false; }
  btn.disabled=false; btn.textContent="دخول";
});
document.addEventListener("click",e=>{
  const b=e.target.closest("#outBtn"); if(!b) return;
  if(!outArm){outArm=true;b.textContent="متأكد؟ اضغط تاني";setTimeout(()=>{outArm=false;const x=$("#outBtn");if(x)x.textContent="تسجيل خروج";},3000);return;}
  window.FB.signOut();
});
(async()=>{
  if(!window.claude?.use) return;
  try{ sample=await window.claude.use("sample"); if(sample) render(); }catch(e){}
  try{ dl=await window.claude.use("downloads"); }catch(e){}
})();
</script>
</body>
