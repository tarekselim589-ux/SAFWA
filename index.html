<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>

<style>
:root{
  --tile:#EEF5F6; --card:#FFFFFF; --water:#0B5770; --deep:#073B4C; --ink:#0F2A33; --muted:#5B7680;
  --rope-r:#D23B3B; --rope-y:#F2C230; --good:#1E8A5A; --bad:#C0392B; --line:#D3E3E7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --tile:#06222C; --card:#0B2F3B; --water:#4FB3D1; --deep:#9FD8E8; --ink:#E4F2F5; --muted:#8FB0BA;
  --rope-r:#F06262; --rope-y:#F2C230; --good:#4CC38A; --bad:#FF7B6B; --line:#1C4756;
}}
:root[data-theme="dark"]{
  --tile:#06222C; --card:#0B2F3B; --water:#4FB3D1; --deep:#9FD8E8; --ink:#E4F2F5; --muted:#8FB0BA;
  --rope-r:#F06262; --rope-y:#F2C230; --good:#4CC38A; --bad:#FF7B6B; --line:#1C4756;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--tile);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header{padding:16px 0 10px}
.brand{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;font-size:24px;line-height:1.2;margin:0;color:var(--deep)}
.brand small{display:block;font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:500;font-size:14px;color:var(--muted)}
.rope{height:6px;border-radius:3px;margin:10px 0 0;
  background:repeating-linear-gradient(90deg,var(--rope-r) 0 14px,#fff 14px 20px,var(--water) 20px 34px,#fff 34px 40px)}
h2{font-family:"Reem Kufi",sans-serif;font-weight:500;font-size:19px;margin:22px 0 10px;color:var(--deep)}
.meet{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--deep);color:var(--tile);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.meet b{font-family:"Reem Kufi",sans-serif;font-size:26px;line-height:1}
.meet span{font-size:14px;opacity:.85}
.more{background:none;border:0;color:var(--water);font-weight:600;font-size:14px;padding:4px 0}
h3{font-size:16px;margin:0 0 4px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rope-y);outline-offset:2px}
.btn{background:var(--water);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
:root[data-theme="dark"] .btn{color:#06222C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06222C}}
:root[data-theme="dark"] .btn.ghost{color:var(--water)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--water)}}
.btn.ghost{background:transparent;color:var(--water);border:1.5px solid var(--water)}
.btn.small{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lanes{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.lane{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:0;border-bottom:2px dashed var(--line);padding:12px 12px}
.lane:last-child{border-bottom:0}
.lane:hover{background:color-mix(in srgb,var(--water) 6%,transparent)}
.lnum{font-family:"Reem Kufi",sans-serif;font-size:22px;color:var(--water);text-align:center}
.lname{font-weight:600}
.lmeta{font-size:14px;color:var(--muted)}
.trend{font-size:14px;font-weight:600;white-space:nowrap;direction:ltr}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px;flex:1;min-width:130px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--tile)}
input.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
input[type="date"]{direction:ltr;text-align:right}
input[type="checkbox"]{width:auto!important;min-width:0;flex:0 0 auto;padding:0;accent-color:var(--water);transform:scale(1.3);margin:0 2px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.mcard .x[data-medit]{color:var(--water);font-size:18px;font-weight:700;opacity:1}
.mcard.on{border-color:var(--water);box-shadow:0 0 0 3px color-mix(in srgb,var(--water) 18%, transparent)}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 16px -10px rgba(0,0,0,.25)}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;line-height:1.5;padding:4px 2px;border-radius:10px}
.tabbar i{display:block;font-size:20px;font-style:normal;line-height:1.2}
.tabbar button[aria-current="true"]{color:var(--water)}
.card{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card b{display:block;font-size:17px;color:var(--deep)}
.card span{font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--rope-y);color:#3B2C00;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.warn{display:flex;gap:8px;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--rope-r);margin-bottom:8px;font-size:15px}
.warn.soft{border-right-color:var(--rope-y)}
.warn.tip{border-right-color:var(--water);background:color-mix(in srgb,var(--water) 6%,var(--card))}
.cardwrap .sheet{background:#fff;color:#0E1B2E;border-radius:12px;padding:18px 16px;margin-bottom:14px;border:1px solid #E1E9F4}
.crel{position:relative}
.crib{display:inline-block;background:#2563C7;color:#fff;font-style:italic;font-weight:700;font-size:11.5px;padding:3px 11px 4px;
  clip-path:polygon(2% 6%,97% 0,100% 88%,99% 100%,4% 97%,0 14%)}
.crib.big{font-size:26px;padding:5px 18px 7px}
.cteam{font-weight:700;color:#0E1B2E;font-size:13px;letter-spacing:1.2px;margin:7px 0 0}
.csub{color:#6B7A8C;font-size:12px;margin:3px 0 0}
.ctag{display:inline-block;background:#FDF4F4;color:#D23B3B;font-weight:700;font-size:11px;border-radius:999px;padding:2px 9px;margin-top:6px}
.crope{height:14px;margin:9px 0;background:
  radial-gradient(circle at 7px 7px,#0E1B2E 5.5px,transparent 6.5px) 0 0/95px 14px repeat-x,
  radial-gradient(circle at 7px 7px,#2563C7 5.5px,transparent 6.5px) 0 0/19px 14px repeat-x,
  linear-gradient(#0E1B2E,#0E1B2E) 0 6px/100% 1.5px repeat-x}
.cdry{background:#F3F7FD;border-radius:9px;padding:8px 11px;margin:3px 0 4px;font-size:12px;line-height:1.7}
.cdry b{color:#2563C7}
.cblk{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #E1E9F4;break-inside:avoid}
.cblk:last-of-type{border-bottom:0}
.cnum{font-family:"Reem Kufi";font-weight:700;font-style:italic;font-size:22px;color:#C3D8F5;line-height:1}
.cdist{font-family:"Reem Kufi";font-weight:700;font-size:13px;color:#2563C7;margin-top:3px}
.cbody{font-size:12.5px;line-height:1.72;margin-top:3px}
.ctotal{display:flex;justify-content:space-between;align-items:center;background:#2563C7;color:#fff;padding:9px 14px;margin-top:9px;
  clip-path:polygon(1% 5%,99% 0,100% 93%,99% 100%,1% 96%,0 8%)}
.ctotal span{font-weight:700;font-size:12px;letter-spacing:.8px}
.ctotal b{font-family:"Reem Kufi";font-size:22px;font-style:italic}
.cardwrap .cnsec{padding:11px 0;border-bottom:1px solid #E1E9F4;break-inside:avoid}
.cardwrap .cnsec:last-of-type{border-bottom:0}
.cardwrap .cnh{font-weight:700;font-size:13px;color:#2563C7;margin:0 0 6px}
.cardwrap .cngoal{font-size:13px;line-height:1.85;margin:0;color:#0E1B2E}
.cardwrap .cnphase{font-size:12px;line-height:1.7;margin:7px 0 0;color:#6B7A8C}
.cardwrap .cnbar{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.cardwrap .cntrack{display:block;height:9px;background:#EEF3FA;border-radius:999px;overflow:hidden}
.cardwrap .cnfill{display:block;height:9px;border-radius:999px}
.cardwrap .cnval{font-family:"Reem Kufi";font-size:12px;color:#2563C7;text-align:left;
  direction:ltr;white-space:nowrap}
.cardwrap .cnitem{margin:0 0 9px;font-size:12.5px;line-height:1.72}
.cardwrap .cnitem:last-child{margin-bottom:0}
.cardwrap .cnitem b{color:#0E1B2E;display:block}
.cardwrap .cnitem i{color:#6B7A8C;font-style:normal;display:block}
.cardwrap .cnitem u{color:#2563C7;text-decoration:none;display:block}
.cardwrap .cnnote{background:#FFF9EC;border-right:3px solid #E0A830;border-radius:6px;
  padding:8px 11px;margin:0 0 7px;font-size:12.5px;line-height:1.72}
.cardwrap .cnnote:last-child{margin-bottom:0}
.cardwrap .cnnote b{display:block;color:#0E1B2E}
.cardwrap .cntg{font-size:12.5px;line-height:1.8;margin:0 0 8px}
.cardwrap .cntg:last-child{margin-bottom:0}
.cardwrap .cntg b{display:block;color:#2563C7}
.cardwrap .cntg span{direction:ltr;unicode-bidi:embed;display:inline-block}
.cardwrap .cnflat{font-size:12.5px;line-height:1.8;margin:0;color:#6B7A8C}
.ch3{font-family:"Reem Kufi";font-weight:500;font-size:15px;margin:12px 0 4px;color:#0E1B2E}
.cp,.cul li{font-size:12.8px;line-height:1.8;margin:0;color:#0E1B2E}
.cul{margin:0;padding-inline-start:18px}
.cwarn{border-inline-start:4px solid #D23B3B;background:#FDF4F4;padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.7;margin-top:9px}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff}
  .nav,.tabbar,.toast,header,.noprint{display:none !important}
  .wrap{padding:0;max-width:none}
  .cardwrap .sheet{border:0;border-radius:0;padding:0;margin:0}
  .cardwrap .sheet.print+.sheet.print{break-before:page}
}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-family:"Reem Kufi",sans-serif;font-size:20px;color:var(--water);text-align:center}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font:inherit;color:inherit}
.rowbtn:last-of-type{border-bottom:0}
.rowbtn:active{background:color-mix(in srgb,var(--water) 7%,transparent)}
@media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--tile);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.issue{border-right:5px solid var(--rope-r);padding:10px 14px;margin-bottom:10px;background:var(--card);border-radius:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.issue.ok{border-right-color:var(--good)}
.issue p{margin:2px 0 8px;color:var(--muted);font-size:15px}
.drill{margin:6px 0 0;padding:8px 10px;background:var(--tile);border-radius:8px;font-size:15px}
.drill b{color:var(--deep)}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .t{direction:ltr;font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:14px}
.back{background:none;border:0;color:var(--water);font-weight:600;padding:0;margin-top:16px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.ai{white-space:pre-wrap;font-size:15px;margin-top:10px}
.toast{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;margin-bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--deep);color:var(--tile);padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.askov{position:fixed;inset:0;z-index:60;background:rgba(7,59,76,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.askbox{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.askbox p{margin:0 0 16px;font-weight:600;line-height:1.7}
.askbox .row{gap:8px;justify-content:flex-end}
.btn.bad{background:var(--bad)}
.note{font-size:14px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.pm-bar{height:10px;background:var(--tile);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.pm-bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.pm-set{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;color:var(--ink);font:inherit}
.pm-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pm-t{font-size:21px;font-weight:700;line-height:1.4}
.pm-d{font-size:20px;font-weight:700;color:var(--water);direction:ltr;white-space:nowrap}
.pm-l{display:block;font-size:20px;line-height:1.9;margin-top:4px}
.pm-n{display:block;font-size:19px;font-weight:700;margin-top:10px;color:var(--deep)}
.pm-set.done{opacity:.5;border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--card))}
.pm-set.done .pm-t::before{content:"✓ ";color:var(--good)}
.wm{position:fixed;inset:0;z-index:4;pointer-events:none;background:var(--logo) center 46%/min(82vw,560px) auto no-repeat;opacity:.055}
:root[data-theme="dark"] .wm{opacity:.07;filter:brightness(1.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{opacity:.07;filter:brightness(1.9)}}
@media print{.wm{display:none}}
.imgov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;padding:16px}
.imgov img{width:100%;display:block;margin:0 0 12px;background:#fff;border-radius:8px}
.imgov p{color:#fff;margin:0 0 10px}
</style>
<style>
[hidden]{display:none!important}
.lgov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--tile,#f2f5f9);color:var(--ink,#111)}
.lgbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;background:var(--card,#fff);border:1px solid var(--line,#dbe3ec);border-radius:16px;padding:22px}
.lgbox #lgFields{display:flex;flex-direction:column;gap:12px}
.lgbox #lgFields[hidden]{display:none}
.lgt{margin:0;font-weight:700;font-size:20px;text-align:center}
.lgl{margin:0;text-align:center;opacity:.7}
.lgf{display:flex;flex-direction:column;gap:4px;font-size:13px;opacity:.9}
.lgf input{font:16px inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#dbe3ec);background:transparent;color:inherit}
.lgerr{margin:0;color:#c0392b;font-size:14px;text-align:center}
.migr{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}
.migr .askbox p{margin:0 0 14px}
/* سطور "شغل السباق ده" و"تحليل أعمق" */
.row2{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.7}
.row2:last-of-type{border-bottom:0}
.row2>i{font-style:normal;font-weight:700;text-align:center;color:var(--muted)}
.row2>i.g{color:var(--good)} .row2>i.r{color:var(--bad)}
.txt{font-size:15px;line-height:1.7}
p.h2{font-weight:600}
.offbar{position:sticky;top:0;z-index:15;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--bad);color:#fff;font-size:14px;font-weight:600;text-align:center}
.outbtn{display:block;margin:18px auto 8px;background:none;border:1px solid var(--line,#ccc);color:inherit;opacity:.75;border-radius:9px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
</style>
<style id="glass">
/* ===== Liquid glass skin, laid over the app's own colours ===== */

:root{
  --g-fill:   rgba(255,255,255,.52);
  --g-fill-2: rgba(255,255,255,.38);
  --g-edge:   rgba(255,255,255,.75);
  --g-shadow: 0 8px 28px rgba(27,78,99,.10), 0 1px 2px rgba(27,78,99,.06);
  --g-blur:   saturate(170%) blur(10px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --g-fill:   rgba(18,52,66,.52);
  --g-fill-2: rgba(18,52,66,.36);
  --g-edge:   rgba(255,255,255,.14);
  --g-shadow: 0 8px 32px rgba(0,0,0,.42), 0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --g-fill:   rgba(18,52,66,.52);
  --g-fill-2: rgba(18,52,66,.36);
  --g-edge:   rgba(255,255,255,.14);
  --g-shadow: 0 8px 32px rgba(0,0,0,.42), 0 1px 2px rgba(0,0,0,.3);
}

/* the light that the glass sits on */
body{
  background:
    radial-gradient(860px 600px at  6% -8%, rgba(125,211,252,.42), transparent 60%),
    radial-gradient(740px 560px at 98%  4%, rgba(165,220,235,.38), transparent 58%),
    radial-gradient(820px 640px at 18% 56%, rgba(167,233,220,.30), transparent 60%),
    radial-gradient(900px 700px at 90% 80%, rgba(186,214,240,.34), transparent 62%),
    radial-gradient(940px 720px at 44% 114%,rgba(198,232,222,.30), transparent 62%),
    #F2F8FB !important;
  background-attachment:fixed;
}

/* every surface */
.panel, .card, .chip, .tile, .box, .row, .item, .sheet,
.tabbar, .top, .topbar, .header, .bar, .seg, .list, .note{
  -webkit-backdrop-filter:var(--g-blur);
  backdrop-filter:var(--g-blur);
}

.panel, .card, .sheet, .tile, .box{
  background:var(--g-fill) !important;
  border:1px solid var(--g-edge) !important;
  border-radius:20px !important;
  box-shadow:var(--g-shadow);
}

/* a highlight along the top edge, the way iOS does it */
.panel, .card{ position:relative; overflow:hidden; }
.panel::before, .card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
  pointer-events:none;
}

.card{ transition:transform .18s ease, box-shadow .18s ease; }
.card:active{ transform:scale(.985); }

.chip{
  background:var(--g-fill-2) !important;
  border:1px solid var(--g-edge) !important;
  box-shadow:0 2px 10px rgba(7,59,76,.08);
}
.chip[aria-pressed="true"]{
  background:linear-gradient(180deg, color-mix(in srgb,var(--water) 92%,#fff),
                                     var(--water)) !important;
  border-color:transparent !important;
  box-shadow:0 4px 14px color-mix(in srgb,var(--water) 42%, transparent);
}

.btn:not(.ghost){
  background:linear-gradient(180deg, color-mix(in srgb,var(--water) 90%,#fff),
                                     var(--water)) !important;
  border-radius:14px !important;
  box-shadow:0 5px 18px color-mix(in srgb,var(--water) 38%, transparent);
}

/* the frosted bar at the bottom */
.tabbar{
  background:var(--g-fill) !important;
  border-top:1px solid var(--g-edge) !important;
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  box-shadow:0 -6px 28px rgba(7,59,76,.12);
}
.tabbar button[aria-current="true"]{
  background:color-mix(in srgb,var(--water) 14%, transparent);
}

input, select, textarea{
  background:rgba(255,255,255,.82) !important;
  border:1px solid color-mix(in srgb,var(--water) 30%, transparent) !important;
  border-radius:13px !important;
  box-shadow:inset 0 1px 2px rgba(27,78,99,.08);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--water) !important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--water) 22%, transparent);
}
input::placeholder, textarea::placeholder{ color:rgba(11,87,112,.5) }

/* the training card keeps its paper look - it is meant to be printed */
.cardwrap .sheet{
  background:var(--card) !important;
  -webkit-backdrop-filter:none; backdrop-filter:none;
}


/* the bar at the top is glass too */
.top, .topbar, .header, .hdr, .brand, .apptop{
  background:var(--g-fill) !important;
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--g-edge);
}

/* rows inside a panel get their own thin pane */
.panel .row, .panel .item, .list .row{
  background:var(--g-fill-2);
  border:1px solid var(--g-edge);
  border-radius:14px;
  margin-bottom:8px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}

/* no shadow on the text - it has to read sharp */
body, body *{ text-shadow:none !important; }


/* the app is light, whatever the phone is set to */
:root, :root:not([data-theme="light"]){
  --tile:#EEF5F6; --card:#FFFFFF; --water:#0B5770; --deep:#073B4C;
  --ink:#000000; --muted:#3D5560; --line:#CBDDE3;
  --rope-r:#D23B3B; --rope-y:#F2C230; --good:#1E8A5A; --bad:#C0392B;
  color-scheme:light;
}


/* anything sitting on glass reads black */
.panel, .card, .sheet, .tile, .box, .chip, .row, .item,
.panel *, .card *, .tile *, .box *{
  color:var(--ink);
}
/* except the headings and the figures, which keep the team blue */
h1,h2,h3,h4,.ttl,.title,.hd,.big,.num,.val,.metric{ color:var(--water) !important; }
.muted,.sub,.small,.hint,.note{ color:var(--muted) !important; }
/* a filled button is dark, so its own text stays white - black would
   not be readable on it. the outline button is light glass with black text */
.btn:not(.ghost), .btn:not(.ghost) *, .chip[aria-pressed="true"]{
  color:#fff !important;
}
.btn.ghost{
  background:var(--g-fill) !important;
  color:#000 !important;
  font-weight:700;
  border:1.5px solid var(--water) !important;
  border-radius:14px !important;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 3px 12px rgba(27,78,99,.10);
}
input, select, textarea{ color:#000 !important; }

</style>

<div class="wm" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1 class="brand">Safwa Team <small>أرقام السباحين، تقدمهم، وإيه اللي محتاج شغل</small></h1>
    <div class="rope" aria-hidden="true"></div>
  </header>
  <main id="app"><p class="empty">بيحمّل…</p></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="أقسام البرنامج"></nav>
<div class="toast" id="toast" role="status"></div>
<div id="lg" class="lgov">
  <form id="lgForm" class="lgbox" novalidate>
    <p class="lgt">تسجيل الدخول</p>
    <p class="lgl" id="lgLoad">لحظة…</p>
    <div id="lgFields" hidden>
      <label class="lgf">الإيميل<input id="lgEmail" type="email" autocomplete="username" inputmode="email" dir="ltr"></label>
      <label class="lgf">الباسورد<input id="lgPass" type="password" autocomplete="current-password" dir="ltr"></label>
      <button class="btn" type="submit" id="lgBtn">دخول</button>
      <p class="lgerr" id="lgErr" hidden></p>
    </div>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection as fCol, doc as fDoc, onSnapshot as fSnap, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCLxD-fduSa6kgqnk8pJj8HwtzY3AYfhIg",authDomain:"tarek-74842.firebaseapp.com",projectId:"tarek-74842",storageBucket:"tarek-74842.firebasestorage.app",messagingSenderId:"179196785540",appId:"1:179196785540:web:d4604f645dbbcc6e5f23d1"});
const auth=getAuth(app);
let fs; try{ fs=initializeFirestore(app,{localCache:persistentLocalCache()}); }catch(e){ fs=initializeFirestore(app,{}); }
const P=p=>"safwa_"+p;
const wrap=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
/* A copy of the last account data seen is kept on this phone, so the next open can
   show it at once (read-only) while Firebase connects. Writes always go to Firebase. */
const CKEY="safwa_cache";
let CACHE={}; try{ CACHE=JSON.parse(localStorage.getItem(CKEY)||"{}")||{}; }catch(e){ CACHE={}; }
let cacheT;
/* all four apps share this site's storage, so a copy that grows too big is dropped
   rather than crowding out GYM's own saved numbers */
function flushCache(){ clearTimeout(cacheT); try{ const s=JSON.stringify(CACHE); if(s.length>700000) throw 0; localStorage.setItem(CKEY,s); }catch(e){ try{localStorage.removeItem(CKEY);}catch(x){} } }
function keep(p,v){ CACHE[p]=v; clearTimeout(cacheT); cacheT=setTimeout(flushCache,1000); }
addEventListener("pagehide",()=>{ if(cacheT) flushCache(); });
const FS={
  collection:p=>({
    onSnapshot:(n,e)=>fSnap(fCol(fs,P(p)),s=>{ n({docs:s.docs.map(wrap)}); keep(p,s.docs.map(d=>({i:d.id,d:d.data()}))); },e),
    add:async d=>{const r=await addDoc(fCol(fs,P(p)),d);return {id:r.id};}
  }),
  doc:p=>({
    set:d=>setDoc(fDoc(fs,P(p)),d), update:d=>updateDoc(fDoc(fs,P(p)),d), delete:()=>deleteDoc(fDoc(fs,P(p))),
    onSnapshot:(n,e)=>fSnap(fDoc(fs,P(p)),s=>{ n(wrap(s)); keep(p,{e:s.exists(),d:s.exists()?s.data():null}); },e)
  })
};
window.FB={FS,auth,signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),signOut:()=>signOut(auth)};
onAuthStateChanged(auth,u=>{
  /* remember the sign-in for a fast next open; signing out also drops the saved copy */
  try{ if(u) localStorage.setItem("safwa_in","1"); else { clearTimeout(cacheT); CACHE={}; localStorage.removeItem("safwa_in"); localStorage.removeItem(CKEY); } }catch(e){}
  window.FB.user=u; window.dispatchEvent(new CustomEvent("fbauth",{detail:u}));
});
</script>

/* الوقت لازم يكون منطقي للمسافة: أسرع من 2.7 م/ث (أسرع من الرقم العالمي) أو أبطأ من 0.2 م/ث يبقى غلط في الكتابة */
function timeBad(t,dist){

/* لو الوقت أسرع من أحسن رقمه بأكتر من 15% غالبًا غلطة كتابة، فبنسأل الأول */
async function fastOk(list){

/* ---------- analysis ---------- */
const DRILLS={
  free:[["تمرين الاستلام","دراع يستنى التاني قدام قبل ما يبدأ الشد — بيطوّل الضربة ويصلّح التوقيت."],["سحب الصوابع","سحب أطراف الصوابع على المية في الرجوع — بيرفع الكوع ويخلي الرجوع مريح."],["6-3-6","6 ضربات رجل على الجنب، 3 ضربات دراع، وتكرر — للدوران والتنفس."]],
  back:[["ظهر بدراع واحد","دراع واحد والتاني جنب الجسم — بيركّز على دخول الإيد والشد العميق."],["كوباية على الجبهة","كوباية بلاستيك على الجبهة — الراس ثابتة والجسم يلف حواليها."],["6 ضربات وتبديل","6 ضربات رجل على الجنب ثم تبديل — لدوران الكتف."]],
  breast:[["ضربتين رجل وشدة","ضربتين رجل مع شدة واحدة — بتقوّي الرجل والانسياب."],["شد صدر مع رجل دولفين","شد صدر مع رجل دولفين — بيصلّح توقيت الشد وسرعته."],["عدّ الانسياب","يعد 2 في الانسياب بعد كل ضربة — بيقلل عدد الضربات."]],
  medley:[["ترتيب التحويلات",`تمرين التحويل بين الأنواع: 4×(25 فراشة + 25 ظهر) براحة قصيرة — أضعف جزء في المتنوع هو التحويل.`],["IM Pace",`100 متنوع مقسومة 4×25 بوقت السباق، راحة 15ث.`],["أضعف نوع",`شغل زيادة على النوع اللي بيضيّع فيه وقت في المتنوع.`]],
  fly:[["3-3-3","3 دراع يمين، 3 شمال، 3 كاملين — للإيقاع والتوقيت."],["فراشة بدراع واحد","دراع واحد بالتنفس على الجنب — بيبني الإيقاع من غير إرهاق."],["دولفين تحت المية","رجل دولفين تحت المية بعد الدفعة لحد 10م — أسرع جزء في السباق."]]
};
const PACE=s=>[["سرعة السباق",`8×20 ${s} بسرعة السباق، راحة 30ث — ويعد ضرباته.`],["مقسّمة",`100 ${s} مقسومة 5×20 براحة 10ث، والوقت الكلي يتسجّل.`],["النص التاني أسرع",`6×40 ${s}، الـ20 التانية أسرع من الأولى.`]];
const EFF=s=>[["DPS",`6×20 ${s} بأقل عدد ضربات ممكن بدون ما الوقت يزيد.`],["Swim golf",`وقت الـ20م + عدد الضربات = سكور، ويحاول يقلله كل مرة.`]];
const d2=a=>a.map(([n,h])=>({name:n,how:h}));

/* ---------- تمارين التطوير (لكل سباح) ---------- */
const DEV_DOSE=" المسافة: 6×20، راحة 20ث.";
function strokeGaps(sw){
  const g={};
  entriesOf(sw).forEach(k=>{ const [d,st,p]=k.split("|"), best=bestOf(sw.id,+d,st,+p), b=benchFor(sw,{dist:+d,stroke:st,pool:+p});
    if(best==null||!b||!b.third) return;
    const pct=(best/b.third-1)*100;
    if(!g[st]||pct>g[st].pct) g[st]={pct,txt:`${d}م ${STROKES[st]}: ${fmt(best)} مقابل الثالث ${fmt(b.third)}`}; });
  return g;
}
function devDrills(sw){
  const out=[], seen=new Set();
  const add=(name,how,why)=>{ if(out.length>=4||seen.has(name)) return; seen.add(name); out.push({name,how,why}); };
  analyze(sw).issues.forEach(i=>{ const d=i.drills&&i.drills[0]; if(d) add(d.name,d.how,i.title); });
  const dose=st=>st==="medley"?"":DEV_DOSE;
  Object.entries(strokeGaps(sw)).sort((a,b)=>b[1].pct-a[1].pct).forEach(([st,g])=>{
    (DRILLS[st]||[]).slice(0,2).forEach(d=>add(d[0],d[1]+dose(st),`أكبر فرق عن الثالث في ${STROKES[st]} (${g.txt})`)); });
  const sts=[...new Set([...(sw.strokes||[]),...entriesOf(sw).map(k=>k.split("|")[1])])].filter(x=>DRILLS[x]);
  const main=sts.filter(x=>x!=="free"); (main.length?main:(sts.length?sts:["free"])).forEach(st=>
    (DRILLS[st]||[]).slice(0,2).forEach(d=>add(d[0],d[1]+dose(st),`نوعه الأساسي: ${STROKES[st]}`)));
  return out;
}
function devCard(sw){
  const L=devDrills(sw); if(!L.length) return "";
  return `<h2>تمارين التطوير</h2><div class="panel">
    <p class="note" style="margin:0 0 6px">التمارين اللي تركّز عليها معاه، بتتحدّث لما أرقامه ونقاط ضعفه تتغير.</p>
    ${L.map(d=>`<div class="drill"><b>${esc(d.name)}:</b> ${esc(d.how)}<br><span class="lmeta">ليه: ${esc(d.why)}</span></div>`).join("")}</div>`;
}
function eventsOf(rs){
  const g={}; rs.forEach(r=>{(g[evKey(r)]=g[evKey(r)]||[]).push(r);});
  return Object.entries(g).map(([k,list])=>{
    list.sort(byDate);
    const times=list.map(r=>r.t), best=Math.min(...times), first=times[0], latest=times[times.length-1];
    return {key:k,list,best,first,latest,n:list.length,change:(first-latest)/first*100,
      bestIdx:times.lastIndexOf(best)};
  }).sort((a,b)=>b.n-a.n);
}
function analyze(sw){
  const rs=state.results.filter(r=>r.swimmer===sw.id);
  const evs=eventsOf(rs), issues=[];
  evs.forEach(e=>{
    const [d,s]=e.key.split("|"), sn=STROKES[s];
    if(e.n>=2 && e.latest>e.best*1.03)
      issues.push({key:e.key,title:`رجوع في ${evName(e.key)}`,detail:`آخر وقت ${fmt(e.latest)} أبطأ من أحسن وقت ${fmt(e.best)} بـ${((e.latest/e.best-1)*100).toFixed(1)}%. ممكن تعب أو حمل زيادة — راجع النوم والحمل الأسبوع ده.`,drills:d2(PACE(sn).slice(0,1))});
    else if(e.n>=4 && e.bestIdx<e.n-3)
      issues.push({key:e.key,title:`ثبات في ${evName(e.key)}`,detail:`مفيش رقم جديد في آخر 3 قياسات. محتاج تغيير في المثير: تكنيك + سرعة سباق.`,drills:d2([DRILLS[s][0],PACE(sn)[1]])});
    const sp=e.list.filter(r=>r.first&&r.second).slice(-3);
    if(sp.length){
      const fade=sp.reduce((a,r)=>a+(r.second-r.first)/r.first,0)/sp.length*100;
      if(fade>10) issues.push({key:e.key,title:`بيقع في النص التاني — ${evName(e.key)}`,detail:`النص التاني أبطأ بمتوسط ${fade.toFixed(0)}%. المشكلة توزيع مجهود وتحمّل سرعة.`,drills:d2(PACE(sn))});
    }
    const sc=e.list.filter(r=>r.sc>0);
    if(sc.length>=3){
      const last=sc[sc.length-1].sc, prev=sc.slice(0,-1).reduce((a,r)=>a+r.sc,0)/(sc.length-1);
      if(last-prev>=2) issues.push({key:e.key,title:`ضرباته زادت في ${sn}`,detail:`آخر عدد ${last} ضربة/طول مقابل متوسط ${prev.toFixed(1)}. الكفاءة بتقل — الضربة بقت أقصر.`,drills:d2([...EFF(sn),DRILLS[s][0]])});
    }
  });
  // weakest stroke vs squad, same distance
  const rel={};
  evs.forEach(e=>{
    const [d,s,p]=e.key.split("|");
    const others=state.swimmers.filter(o=>o.id!==sw.id&&(o.sex||"m")===(sw.sex||"m")).map(o=>{
      const b=state.results.filter(r=>r.swimmer===o.id&&r.dist==d&&r.stroke===s&&(r.pool||20)==p).map(r=>r.t);
      return b.length?Math.min(...b):null;}).filter(x=>x);
    if(others.length>=2){const avg=others.reduce((a,b)=>a+b,0)/others.length;(rel[s]=rel[s]||[]).push(e.best/avg);}
  });
  const rk=Object.entries(rel).map(([s,v])=>[s,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>b[1]-a[1]);
  if(rk.length>=2 && rk[0][1]-rk[rk.length-1][1]>0.04){
    const s=rk[0][0];
    issues.push({gen:true,title:`أضعف نوع مقارنة بالفريق: ${STROKES[s]}`,detail:`الفرق بينه وبين متوسط الفريق في ${STROKES[s]} أكبر من باقي أنواعه. يستاهل زيادة تكنيك فيه.`,drills:d2(DRILLS[s])});
  }
  return {rs,evs,issues};
}

function diffHtml(now,old){
  if(!old) return `<span class="flat">أول مرة</span>`;
  const d=now-old, pc=Math.abs(d)/old*100, cls=d<-0.005?"up":d>0.005?"down":"flat";
  return `<span class="${cls}" style="direction:ltr;display:inline-block">${d<0?"−":"+"}${Math.abs(d).toFixed(2)} ث (${pc.toFixed(1)}%)</span>`;
}
function keepRace(){
  const c=state.race; if(!c) return; const d=state.rdraft=state.rdraft||{};
  for(let i=0;i<c.n;i++){ const st=$("#x-st-"+i), ds=$("#x-d-"+i), tt=$("#x-t-"+i), rk=$("#x-r-"+i);
    if(!tt) continue; d["st"+i]=st.value; d["d"+i]=ds.value; d["t"+i]=tt.value.trim(); d["r"+i]=(rk?.value||"").trim(); }
}

/* ===== قياسات — أرقام التمرين، مخزن لوحده بعيد عن البطولة ===== */
const MPOOLS=[20,25,50];
const MDISTS=[40,50,60,100,200];
const MGAIN=0.55;      // الثانية اللي بيكسبها من كل دوران
const MFATIG=1.025;    // تعب المسافة الزيادة لما نحوّل لـ50

function mLaps(dist,pool){ const n=Math.floor(dist/pool); return (n>=1&&n<=10)?n:0; }
function mFmt(t){ if(t==null||!isFinite(t)) return "—";
  return t>=60 ? Math.floor(t/60)+":"+(t%60).toFixed(2).padStart(5,"0") : t.toFixed(2); }

/* تحويل الرقم لحوض البطولة.
   - نفس المسافة في مسبح 50: فرق عدد الدورانات بس، وده حساب مضبوط
   - 40 أو 60 -> 50: تقدير قصير، المسافة قريبة
   - غير كده: مابنحوّلش، المدى بعيد والرقم هيطلع غلط */
function mTo50(dist,pool,tot){
  if(!tot||pool===50) return null;
  const same=(dist===50||dist===100||dist===200);
  if(!same&&dist!==40&&dist!==60) return null;
  const to=same?dist:50;                                   // نفس المسافة لو تنفع
  if(Math.floor(dist/pool)-1<=Math.floor(to/50)-1&&same) return null;
  const t=convert(tot,dist,pool,to,50);                    // نفس حساب "تحويل الأوقات"
  return t>0?{t,same}:null;
}
function mDrop(laps){ if(!laps||laps.length<2) return null;
  const a=laps[0], b=laps[laps.length-1]; if(!a||!b) return null;
  return ((b-a)/a)*100; }

/* السباح المختار في القياسات — لو اتمسح يرجع لأول سباح موجود */
function mSwId(){ return state.swimmers.some(s=>s.id===state.mSw)?state.mSw:state.swimmers[0]?.id; }
function mSaveNow(){ return once("mSave",mSaveRun); }
async function mSaveRun(){
  const d=state.mdraft||{};
  const tot=parseTime(d.mT||"");
  if(!tot){ toast("اكتب الزمن الكلي"); return; }
  const dist=+(d.mD||60), pool=+(d.mP||20), n=mLaps(dist,pool);
  const tb=timeBad(tot,dist); if(tb){ toast(tb); return; }
  const laps=Array.from({length:n},(_,i)=>parseTime(d["mL"+i]||"")||0);
  const lb=laps.map(x=>timeBad(x,pool)).find(Boolean); if(lb){ toast("طول: "+lb); return; }
  const who=mSwId(), when=d.mDate||today(), st=d.mSt||"free";
  if(!who){ toast("ضيف سباح الأول"); return; }
  if(!(await fastOk([{swimmer:who,stroke:st,dist,pool,t:tot}]))) return;
  const also=!!d.mAlso, strokes=+(d.mN||0)||null;
  const old=state.medit?state.meas.find(x=>x.id===state.medit):null;
  const rec={ swimmer:who, date:when, stroke:st, dist, pool, tot, strokes,
    laps: laps.some(x=>x)?laps:[], also };
  if(old&&old.rid) rec.rid=old.rid;

  // النسخة اللي في البطولة: تتضاف أو تتعدّل أو تتشال حسب المربع
  let newRid=null;
  try{
    if(also){
      const r=mResult(rec);
      if(rec.rid&&state.results.some(x=>x.id===rec.rid)) await store.put("results",rec.rid,r);
      else { const id=await store.addResult(r); if(id){ rec.rid=id; newRid=id; } }
    } else if(rec.rid){
      await store.delResult(rec.rid); rec.rid=null;   // null مش delete: الحفظ المحلي بيدمج
    }
  }catch(e){ toast("مشكلة في النت — جرّب تاني"); return; }

  try{ await store.saveMeas(rec, state.medit||undefined); }
  catch(e){ /* الرقم اللي لسه اتضاف للبطولة يتشال، عشان المحاولة الجاية ماتكررهوش */
    if(newRid){ try{ await store.delResult(newRid); }catch(x){} }
    toast("القياس ماتحفظش — جرّب تاني"); return; }
  state.medit=null;
  ["mT","mN"].concat(Array.from({length:12},(_,i)=>"mL"+i)).forEach(k=>delete state.mdraft[k]);
  toast(old?"اتعدّل":(also?"اتحفظ في القياسات والبطولة":"اتحفظ")); render();
}

/* الرقم اللي بيروح للبطولة - بالأطوال والضربات مش الزمن النهائي بس */
function mResult(m){
  const L=(m.laps||[]).filter(x=>x), r={ swimmer:m.swimmer, stroke:m.stroke,
    dist:m.dist, pool:m.pool, t:m.tot, date:m.date, kind:"test", at:Date.now() };
  if(m.strokes) r.sc=m.strokes;
  if(L.length){
    r.laps=L.slice();
    const half=Math.floor(L.length/2);
    if(half&&L.length%2===0){
      r.first=+L.slice(0,half).reduce((a,b)=>a+b,0).toFixed(2);
      r.second=+L.slice(half).reduce((a,b)=>a+b,0).toFixed(2);
    }
  }
  return r;
}

/* يحط القياس في الفورمة فوق عشان تعدّله */
function mEdit(id){
  const m=state.meas.find(x=>x.id===id); if(!m) return;
  state.medit=id; state.mSw=m.swimmer;
  const d={ mDate:m.date||"", mSt:m.stroke||"free", mD:String(m.dist),
    mP:String(m.pool), mT:mFmt(m.tot), mN:m.strokes?String(m.strokes):"",
    mAlso:!!m.also };
  (m.laps||[]).forEach((t,i)=>{ if(t) d["mL"+i]=t.toFixed(2); });
  state.mdraft=d; render(); scrollTo(0,0);
}

function chart(e){
  const pts=e.list; if(pts.length<2) return `<p class="note">سجّل قياس تاني عشان يظهر الرسم.</p>`;
  const W=320,H=140,P=24, ts=pts.map(r=>r.t), mn=Math.min(...ts), mx=Math.max(...ts), rg=mx-mn||1;
  const xy=pts.map((r,i)=>[P+i*(W-2*P)/(pts.length-1), P/2+(r.t-mn)/rg*(H-P*1.5)]);
  // RTL: newest on the left
  const pos=xy.map(([x,y])=>[W-x,y]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="تطور ${evName(e.key)}">
    <line x1="${P}" x2="${W-P}" y1="${P/2}" y2="${P/2}" stroke="var(--line)" stroke-dasharray="4 4"/>

function daysTo(d){return Math.max(0,Math.ceil((new Date(d)-new Date(today()))/864e5));}
const bestOf=(id,dist,stroke,pool)=>{const t=state.results.filter(r=>r.swimmer===id&&r.dist==dist&&r.stroke===stroke&&(r.pool||20)==(pool||20)).map(r=>r.t);return t.length?Math.min(...t):null;};
function pbRecent(id,days){
  const out=[]; const rs=state.results.filter(r=>r.swimmer===id);
  eventsOf(rs).forEach(e=>{ if(e.n<2) return;
    const hit=e.list.find(r=>r.t===e.best);
    if(hit && daysSince(hit.date)<=days && e.list.indexOf(hit)>0) out.push({key:e.key,t:e.best,date:hit.date});
  });
  return out;
}
function daysSince(d){return Math.floor((new Date(today())-new Date(d))/864e5);}
function autoEntries(sw){
  const out=new Set();
  state.goals.filter(g=>g.swimmer===sw.id&&(g.pool||20)!=20).forEach(g=>out.add(`${g.dist}|${g.stroke}|${g.pool}`));
  state.results.filter(r=>r.swimmer===sw.id&&r.kind==="race"&&daysSince(r.date)<=365).forEach(r=>out.add(evKey(r)));

}
function entriesOf(sw){ return (sw.entries&&sw.entries.length)?sw.entries:autoEntries(sw); }
const champPoolOf=sw=>sw&&sw.champPool===25?25:50;
function entryCandidates(sw,pool){
  // كل سباقات البطولة المنطقية في حمام بطولات السباح (50 أو 25) + أي سباق ليه رقم أو هدف عند السباح
  const out=new Set(), cp=pool||champPoolOf(sw);
  ["free","back","breast","fly"].forEach(st=>[50,100,200].forEach(d=>out.add(`${d}|${st}|${cp}`)));
  out.add(`400|free|${cp}`); out.add(`100|medley|${cp}`); out.add(`200|medley|${cp}`); out.add(`400|medley|${cp}`);
  autoEntries(sw).forEach(k=>out.add(k));
  (sw.entries||[]).forEach(k=>out.add(k));
  return [...out].sort((a,b)=>{const A=a.split("|"),B=b.split("|");
    return A[1].localeCompare(B[1])||(+A[0]-+B[0]);});
}

function hasBench(sw,k){ const [d,st,p]=k.split("|"); return !!benchFor(sw,{dist:+d,stroke:st,pool:+p}); }

function suggestions(){

    if(nm&&left<=42&&ent.length) s.push(`${I(sw.name)}: داخل ${ent.slice(0,3).map(k=>evName(k)).join(" · ")} — التخصص بتاعه هيتبني على السباقات دي.`);
    if(nm&&left<=42&&!ent.length) s.push(`${I(sw.name)}: محددش سباقاته في البطولة الجاية — حددها من "تعديل" في صفحته.`);

    entriesOf(sw).forEach(k=>{ const [d,st,p]=k.split("|");

        need.add(`${d}م ${STROKES[st]} · ${SEX[sx]} ${g}`); }); });
  [...need].slice(0,3).forEach(x=>s.push(`مفيش أرقام فئة لـ${x} — سجّلها عشان الأهداف تبقى واقعية.`));

function warnings(){

    const b0=bestOf(g.swimmer,g.dist,g.stroke,g.pool); if(b0==null||b0<=g.target) return;
    if(!byEv[k]||g.target>byEv[k].target) byEv[k]=g; });
  Object.values(byEv).forEach(g=>{

  });
  state.swimmers.forEach(s=>{
    const rs=state.results.filter(r=>r.swimmer===s.id);
    if(!rs.length){ if(!state.meas.some(m=>m.swimmer===s.id)) w.push({hard:false,txt:`${I(s.name)}: مفيش أي أرقام مسجلة.`}); return; }

    const d=Math.min(daysSince(last.date), lastM?daysSince(lastM):9e9);
    if(d>21) w.push({hard:false,txt:`${I(s.name)}: آخر قياس بقاله ${d} يوم — محتاج تيست.`});
    eventsOf(rs).forEach(e=>{ if(e.n>=2 && e.latest>e.best*1.03)
      w.push({hard:left!=null&&left<=21,txt:`${I(s.name)}: رجوع في ${evName(e.key)} — آخر وقت أبطأ من أحسن وقت بـ${((e.latest/e.best-1)*100).toFixed(1)}%.`}); });
  });

  for(let i=0;i<Math.min(a,3);i++){ const t=IM_TR[i]; out.push(`تكرار ${i+1}: ${t.n} — ${t.tip}`); }
  if(a>3) out.push(`تكرار 4${a>4?" لحد "+a:""}: نفس التحويلات الثلاثة بالترتيب — ظهر←صدر، صدر←حرة، فراشة←ظهر`);
  return out;
}

    let extra=0; alloc.forEach(x=>{ if(x.st==="fly"&&x.v>flyCap){ extra+=x.v-flyCap; x.v=flyCap; x.capped=true; } });
    if(extra>0){
      const others=alloc.filter(x=>!x.capped);
      if(others.length){ let i=0; while(extra>0){ others[i%others.length].v+=20; extra-=20; i++; } }

          notes:[...(n40>0?[`${n40}×40: كل تكرار 20 فراشة ثم 20 ظهر بتحويل سريع عند حيطة الـ20، بأقصى سرعة · راحة 60ث`]:[]),...(r20>0?[`${r20}×20 صدر بأقصى سرعة من الدفعة · راحة 45ث`]:[]),`السرعة أهم من العدد — لو نزلت في تكرارين ورا بعض اوقف`]};

        notes:[`${cnt}×20 من الدفعة بأقصى سرعة · راحة 45ث`,`قارن بأحسن 20م عنده — لو السرعة نزلت في تكرارين ورا بعض، يقف`]};

      E=[ln(a,40,`${se} build`),ln(b,20,drn),ln(c,20,`${se} short speed`)];

  };
  const parts=alloc.map(x=>{ const p=build(x.st,x.v,x.tech);
    if(x.capped) p.notes=[...p.notes,`الفراشة محددة بـ ${flyCap}م (15% من الحصة) تحت 13 سنة لحماية الكتف، والباقي اتحوّل لتكنيك.`];
    return p; });

    notes:parts.flatMap(p=>[`— ${p.sn} (${p.v}م):`,...p.notes]), vol};

async function sheetPng(m){

  const wrap=(txt,font,maxW)=>{ ctx.font=font; const words=String(txt).split(" "), L=[]; let cur="";
    for(const w of words){ const t=cur?cur+" "+w:w; if(ctx.measureText(t).width>maxW&&cur){ L.push(cur); cur=w; } else cur=t; }
    if(cur) L.push(cur); return L; };

      let i=0; for(let x=PAD+8;x<=W-PAD-8;x+=28,i++){ ctx.fillStyle=i%5===0?C.deep:C.chip; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.fill(); } } };

    if(draw&&lg){ const lw=250, lh=lw*lg.height/lg.width; ctx.drawImage(lg,W-PAD-lw,y+50-lh/2,lw,lh); }
    y+=100+34;
    wrap(m.team,`700 32px ${FF}`,W-2*PAD).forEach(l=>{ if(draw){ ctx.fillStyle=C.ink; ctx.font=`700 32px ${FF}`; ctx.fillText(l,PAD,y+28); } y+=42; });
    y+=4;
    wrap(m.sub,`400 26px ${FF}`,W-2*PAD).forEach(l=>{ if(draw){ ctx.fillStyle=C.muted; ctx.font=`400 26px ${FF}`; ctx.fillText(l,PAD,y+24); } y+=36; });
    y+=18; rope(y,draw); y+=40;
    const TX=PAD+176, MW=W-PAD-TX;
    m.blocks.forEach(b=>{ const y0=y;
      if(b.label){ ctx.font=`700 22px ${FF}`; const cw=ctx.measureText(b.label).width+30;
        if(draw){ ctx.fillStyle=C.chip; ctx.fillRect(TX,y,cw,38); ctx.fillStyle="#fff"; ctx.font=`700 22px ${FF}`; ctx.fillText(b.label,TX+15,y+27); }
        y+=38+14; }
      b.lines.forEach((ln,i)=>{ const ind=ln.ind?30:0, font=`${ln.b?700:400} 29px ${FF}`; if(ln.b&&i>0) y+=12;
        wrap(ln.t,font,MW-ind).forEach(l=>{ if(draw){ ctx.fillStyle=ln.b?C.deep:C.ink; ctx.font=font; ctx.fillText(l,TX+ind,y+28); } y+=42; }); });
      if(draw){ ctx.fillStyle="rgba(11,87,112,.35)"; ctx.font=`italic 800 46px ${FF}`; ctx.fillText(String(b.n).padStart(2,"0"),PAD,y0+40);
        if(b.dist){ ctx.fillStyle=C.water; ctx.font=`700 28px ${FF}`; ctx.fillText(b.dist+" m",PAD,y0+88); } }
      y=Math.max(y,y0+110)+16;
      if(draw){ ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); }
      y+=22; });
    if(m.total){ y+=6; rope(y,draw); y+=34;
      if(draw){ ctx.fillStyle=C.chip; ctx.fillRect(PAD,y,W-2*PAD,96); ctx.fillStyle="#fff"; ctx.font=`700 28px ${FF}`; ctx.fillText("TOTAL DISTANCE",PAD+32,y+60);
        ctx.font=`italic 800 48px ${FF}`; ctx.textAlign="right"; ctx.fillText(m.total.toLocaleString("en")+" m",W-PAD-32,y+66); ctx.textAlign="left"; }
      y+=96; }
    return y+PAD; };
  const H=run(false); cv.width=W; cv.height=H; run(true);

}

  add("%PDF-1.4\n"); add(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));

  const e=new Date(s); e.setDate(s.getDate()+6);

async function restore(txt){
  let d; try{d=JSON.parse(txt);}catch(e){toast("الملف مش مقروء");return;}
  if(!d||!Array.isArray(d.swimmers)){toast("الملف مش نسخة احتياطية");return;}
  let added=0;
  const ex=new Set(state.swimmers.map(s=>s.id)), er=new Set(state.results.map(r=>r.id)), eg=new Set(state.goals.map(g=>g.id));
  try{
    for(const s of d.swimmers){ if(ex.has(s.id)) continue; const {id,...rest}=s; await store.put("swimmers",id,rest); added++; }
    for(const r of (d.results||[])){ if(er.has(r.id)) continue; const {id,...rest}=r; await store.put("results",id,rest); added++; }
    for(const g of (d.goals||[])){ if(eg.has(g.id)) continue; const {id,...rest}=g; await store.put("goals",id,rest); added++; }
    const em=new Set(state.meets.map(m=>m.id));
    for(const m of (d.meets||[])){ if(em.has(m.id)) continue; const {id,...rest}=m; await store.saveMeet(rest,id); added++; }
    const eb=new Set(state.bench.map(b=>b.id));
    for(const b of (d.bench||[])){ if(eb.has(b.id)) continue; const {id,...rest}=b; await store.saveBench(rest,id); added++; }
    const emz=new Set(state.meas.map(m=>m.id));
    for(const m of (d.meas||[])){ if(emz.has(m.id)) continue; const {id,...rest}=m; await store.saveMeas(rest,id); added++; }
    if(d.meet&&!state.meet) await store.setMeet(d.meet);
    toast(added?`اترجّع ${added} صف`:"كل حاجة موجودة بالفعل");
  }catch(e){toast(`حصلت مشكلة في الاسترجاع${added?` (اترجّع ${added} بس)`:""}، جرّب تاني`); render(); return false;}
  render(); return true;
}

    ? N.drills.map(d=>`<p class="cnitem"><b>${esc(d[0])}</b><i>${esc(d[1])}</i><u>ركّز: ${esc(d[2])}</u></p>`).join("")
    : `<p class="cnflat">مفيش درل النهاردة — سباحة كاملة ورجل بس.</p>`;
  const cues=N.cues.map(c=>`<p class="cnitem"><b>${esc(c[0])}</b><i>${esc(c[1])}</i></p>`).join("");
  const notes=N.notes.length
    ? sec("ملاحظات مكتوبة على الكارت النهاردة",
        N.notes.map(n=>`<p class="cnnote"><b>${esc(n[0])}</b>${esc(n[1])}</p>`).join(""))
    : "";
  const tg=N.tg.length
    ? sec("الأزمنة المستهدفة النهاردة",
        N.tg.map(t=>`<p class="cntg"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></p>`).join("")+
        /* اللي لسه مالوش ولا رقم ولا قياس — بتتحسب من الأرقام الحالية بدل ما تبقى أسماء ثابتة */
        (()=>{ const no=planSwimmers().filter(s=>!state.results.some(r=>r.swimmer===s.id)&&!state.meas.some(m=>m.swimmer===s.id)).map(s=>s.name);
          return no.length?`<p class="cnflat">${esc(no.join(" و"))} من غير أرقام — ${no.length>1?"محتاجين":"محتاج"} قياس.</p>`:""; })())
    : "";
  return `<div class="sheet noprint"><div class="crel" dir="rtl">
    <span class="crib big">الملاحظات</span><p class="cteam">SAFWA TEAM</p>
    <p class="csub">${esc(cpSub(S,false))}</p>
    <span class="ctag">للكوتش — مابتتطبعش</span>
    <div class="crope"></div>
    ${sec("هدف الحصة",`<p class="cngoal">${esc(N.goal)}</p>`+
      (N.phase?`<p class="cnphase">${esc(N.phase)}</p>`:""))}
    ${N.works.length?sec("الحصة بتشتغل على",works):""}
    ${N.works.length?sec("الدرلز اللي فيها وبتعمل ايه",drills):""}
    ${cues?sec("التعليمات المكتوبة ومعناها",cues):""}
    ${notes}
    ${tg}
    ${sec(N.works.length?"ثابت في كل حصة":"يوم السباق",N.deck.map(d=>`<p class="cnitem"><b>${esc(d)}</b></p>`).join(""))}
  </div></div>`;
}

function ccardView(){
  const S=cpFind();
  const back=`<div class="row noprint" style="margin-bottom:10px"><button class="btn" id="cardImg">شير على واتساب</button>
      <button class="btn ghost" data-go="cplan">رجوع للخطة</button></div>`;
  if(!S) return `<div class="cardwrap">${back}<div class="panel empty">اختار حصة من الخطة.</div></div>`;
  const blk=(n,label,lines,dist,unit)=>`<div class="cblk"><div><div class="cnum">${n<10?"0":""}${n}</div><div class="cdist">${dist?unit:""}</div></div>
    <div><span class="crib">${label}</span><div class="cbody">${lines}</div></div></div>`;
  const sp='<br><span style="display:inline-block;height:6px"></span>';
  const body=S.blocks.slice(0,-1), fin=S.blocks[S.blocks.length-1];
  const specEn=S.specs.map(g=>`<b>${esc(g.names.join(" + "))}</b><br>${g.eitems.map(l=>"&nbsp;&nbsp;"+esc(l)).join("<br>")}`).join(sp);
  const specAr=S.specs.map(g=>`<b style="color:var(--ink)">${esc(g.names.join(" + "))}</b><br>${g.items.map(l=>"&nbsp;&nbsp;"+esc(l)).join("<br>")}`).join(sp);
  const en=`<div class="sheet print"><div class="crel" dir="ltr" style="text-align:left">
    <span class="crib big">TRAINING</span><p class="cteam">SAFWA TEAM</p>
    <p class="csub">${esc(cpSub(S,true))}</p>
    <div class="crope"></div>
    ${body.map((b,i)=>blk(i+1,b[0],b[4].map(esc).join("<br>"),b[2],b[2]+" m")).join("")}
    ${S.spec?blk(body.length+1,`SPECIALTY — ${S.spec} m EACH`,specEn,S.spec,S.spec+" m"):""}
    ${blk(body.length+(S.spec?2:1),fin[0],fin[4].map(esc).join("<br>"),fin[2],fin[2]+" m")}
    <div class="crope"></div><div class="ctotal"><span>TOTAL DISTANCE</span><b>${S.tot.toLocaleString("en")} m</b></div>
  </div></div>`;
  const ar=`<div class="sheet noprint"><div class="crel" dir="rtl">
    <span class="crib big">التمرينة</span><p class="cteam">SAFWA TEAM</p>
    <p class="csub">${esc(cpSub(S,false))}</p>
    <span class="ctag">للقراءة بس — مابتتطبعش</span>
    <div class="crope"></div>
    ${body.map((b,i)=>blk(i+1,b[1],b[3].map(esc).join("<br>"),b[2],b[2]+" م")).join("")}
    ${S.spec?blk(body.length+1,`التخصص — ${S.spec}م لكل سباح`,specAr,S.spec,S.spec+" م"):""}
    ${blk(body.length+(S.spec?2:1),fin[1],fin[3].map(esc).join("<br>"),fin[2],fin[2]+" م")}
    <div class="crope"></div><div class="ctotal"><span>المسافة الكلية</span><b>${S.tot} م</b></div>
  </div></div>`;
  const i=CPLAN.findIndex(x=>x.n===S.n);
  const nav=`<div class="row noprint" style="margin-top:10px">
    ${i>0?`<button class="btn ghost" data-cday="${CPLAN[i-1].n}">→ السابقة</button>`:""}
    ${i<CPLAN.length-1?`<button class="btn ghost" data-cday="${CPLAN[i+1].n}">التالية ←</button>`:""}</div>`;
  return `<div class="cardwrap">${back}${en}${ar}${cnotesSheet(S)}${nav}</div>`;
}

function render(){
  const app=$("#app");
  app.innerHTML=navBar()+(state.view==="meas"?measView():state.view==="cplan"?cplanView():state.view==="ccard"?ccardView():state.view==="plan"?planView():state.view==="card"?cardView():state.view==="picks"?picksView():state.view==="meets"?meetsView():state.view==="board"?boardView():state.view==="tools"?toolsView():state.view==="settings"?settingsView():state.view==="race"?raceSection():state.view==="goals"?goalsView():state.view==="relay"?relayView():state.view==="conv"?convView():state.view==="cmp"?cmpView():state.view==="log"?logView():state.view==="swimmer"?swimmerView():state.view==="pool"?poolView():home());
  ltrNums(app);
  if(state.view==="pool") keepAwake(); else releaseAwake();
  if(mode==="warm") app.insertAdjacentHTML("afterbegin",`<p class="note" style="text-align:center">بيحدّث بياناتك…</p>`);
  if(mode==="offline") app.insertAdjacentHTML("afterbegin",`<p class="offbar">من غير نت — الخطة والكروت شغالة، والتسجيل مقفول لحد ما النت يرجع.</p>`);
  else if((mode==="db"||mode==="warm")&&!navigator.onLine) app.insertAdjacentHTML("afterbegin",`<p class="offbar">النت فاصل — أي حاجة هتسجلها هتستنى لحد ما النت يرجع، ماتقفلش التطبيق.</p>`);
  else if(mode==="local") app.insertAdjacentHTML("beforeend",`<p class="note">الأرقام محفوظة على الجهاز ده بس.</p>`);
  if(mode==="db") app.insertAdjacentHTML("beforeend",`<button type="button" class="outbtn" id="outBtn">تسجيل خروج</button>`);
}

document.addEventListener("click",e=>{

             await store.delMeas(b.dataset.mdel);

document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="mSw"){ state.mSw=e.target.value; render(); }
  if(e.target&&(e.target.id==="mD"||e.target.id==="mP")){
    const d=state.mdraft||{}, n=mLaps(+(d.mD||60),+(d.mP||20));
    Object.keys(d).forEach(k=>{ const m=/^mL(\d+)$/.exec(k); if(m&&+m[1]>=n) delete d[k]; });
    render(); }
},true);
function liveCapture(e){
  const t=e.target; if(!t||!t.id&&!t.classList) return;
  let by=/^y-(st|d|f|th)-(\d+)$/.exec(t.id||"");
  if(by){ state.bdraft=state.bdraft||{}; state.bdraft[by[1]+by[2]]=t.value; return; }
  let lg=/^g-sw-(\d+)$/.exec(t.id||"");
  if(lg){ state.draft=state.draft||{}; state.draft["sw"+lg[1]]=t.value; return; }
  lg=/^g-(st|d|t)-(\d+)-(\d+)$/.exec(t.id||"");
  if(lg){ state.draft=state.draft||{}; state.draft[`${lg[1]}${lg[2]}_${lg[3]}`]=t.value; return; }
  const m=/^x-(st|d|t|r)-(\d+)$/.exec(t.id||"");
  if(m){ state.rdraft=state.rdraft||{}; state.rdraft[({st:"st",d:"d",t:"t",r:"r"})[m[1]]+m[2]]=t.value; return; }

  if(t.id==="mAlso"){ state.mdraft=state.mdraft||{}; state.mdraft.mAlso=t.checked; return; }
  if(/^(mDate|mSt|mD|mP|mT|mN)$/.test(t.id||"")||/^mL\d+$/.test(t.id||"")){
    state.mdraft=state.mdraft||{}; state.mdraft[t.id]=t.value; return; }

  if(t.id==="lDate"){ if(state.log) state.log.date=t.value||state.log.date; }
}
document.addEventListener("input",e=>{
  if(["cT","cD1","cP1","cD2","cP2"].includes(e.target.id)){
    state.conv={t:$("#cT").value,d1:$("#cD1").value,p1:$("#cP1").value,d2:$("#cD2").value,p2:$("#cP2").value};
    const tt=parseTime(state.conv.t), o=document.querySelector(".stat b");
    if(o) o.textContent=tt?fmt(convert(tt,+state.conv.d1,+state.conv.p1,+state.conv.d2,+state.conv.p2)):"—";
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="edPool"){
    const sw=state.swimmers.find(x=>x.id===state.sel), np=+e.target.value, op=np===25?50:25;
    const cur=[...document.querySelectorAll("#edEnt [aria-pressed=true]")].map(b=>{const a=b.dataset.k.split("|"); if(+a[2]===op) a[2]=np; return a.join("|");});
    const box=$("#edEnt"); if(sw&&box) box.innerHTML=entChips(sw,np,cur);
    return;
  }
  if(e.target.classList.contains("gf")){
    state.gf={sw:$("#gSw").value,stroke:$("#gSt").value,dist:+$("#gD").value,pool:+$("#gP").value}; render(); return;
  }
  if(e.target.classList.contains("cf2")){
    Object.assign(state.bf,{meet:$("#bfMeet").value,age:$("#bfAge").value,sex:$("#bfSex").value,pool:+$("#bfP").value}); return;
  }
  if(e.target.classList.contains("bf")){
    Object.assign(state.board,{stroke:$("#bSt").value,dist:+$("#bD").value,pool:+$("#bP").value}); render(); return;
  }
  if(e.target.classList.contains("rf")){
    const sw=$("#rSw").value, changed=sw!==state.race.sw;
    keepRace(); if(changed) state.rdraft={};
    Object.assign(state.race,{meet:$("#rMeet").value,date:$("#rDate").value,pool:+$("#rPool").value,sw});
    if(changed){ state.race.n=1; const s2=state.swimmers.find(x=>x.id===sw); state.race.pool=champPoolOf(s2); }

});

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  if(t.dataset.go==="log"&&state.view==="swimmer"&&state.sel){state.draft=state.draft||{}; state.draft.sw0=state.sel;}
  if(t.dataset.go){state.view=t.dataset.go;render();scrollTo(0,0);return;}
  if(t.dataset.open){state.sel=t.dataset.open;state.event=null;state.view="swimmer";render();scrollTo(0,0);return;}
  if(t.dataset.ev){state.event=t.dataset.ev;render();return;}
  if(t.dataset.k){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")==="true"?"false":"true");return;}
  if(t.dataset.del){ if(await askConfirm("تمسح الوقت ده؟")){try{await store.delResult(t.dataset.del);toast("اتمسح");}catch(e){toast("ماتمسحش، جرّب تاني");}} return;}
  if(t.id==="nsSave"){
    const name=$("#nsName").value.trim(), year=+normDigits($("#nsYear").value)||null;
    const strokes=[...document.querySelectorAll("#nsStrokes [aria-pressed=true]")].map(b=>b.dataset.k);
    if(!name){toast("اكتب اسم السباح");return;}
    await once("nsSave",async()=>{ t.disabled=true;
      try{await store.addSwimmer({name,year,strokes,sex:$("#nsSex")?.value||"m"});toast("اتضاف "+name);}catch(e){toast("ماتضافش، جرّب تاني");}
      t.disabled=false; });
    return;
  }
  if(t.id==="lSave"){
    const c=state.log; keepLog(); const d=state.draft||{}, date=c.date||today(), rows=[];
    c.groups.forEach((n,gi)=>{ const id=d["sw"+gi]||state.swimmers[0].id;
      for(let ri=0;ri<n;ri++){ const raw=(d[`t${gi}_${ri}`]||"").trim(); if(!raw) continue;
        rows.push({id,stroke:d[`st${gi}_${ri}`]||"free",dist:+(d[`d${gi}_${ri}`]||40),raw,tk:`t${gi}_${ri}`}); } });
    if(!rows.length){toast("اكتب وقت واحد على الأقل");return;}
    const bad=rows.find(x=>!parseTime(x.raw)); if(bad){toast("وقت مش مفهوم: "+bad.raw);return;}
    const odd=rows.map(x=>timeBad(parseTime(x.raw),x.dist)).find(Boolean); if(odd){toast(odd);return;}
    if(busy.has("lSave")) return;
    if(!(await fastOk(rows.map(x=>({swimmer:x.id,stroke:x.stroke,dist:x.dist,pool:20,t:parseTime(x.raw)}))))) return;
    if(busy.has("lSave")) return; busy.add("lSave");
    t.disabled=true; const cmp=[]; let n=0;
    try{
      for(const x of rows){
        const r={swimmer:x.id,stroke:x.stroke,dist:x.dist,t:parseTime(x.raw),date,kind:"test",at:Date.now()+n};
        const same=state.results.filter(o=>o.swimmer===r.swimmer&&o.stroke===r.stroke&&o.dist==r.dist&&(o.pool||20)==20);
        cmp.push({r,old:prevOf(r,same),best:same.length?Math.min(...same.map(o=>o.t)):Infinity});
        await store.addResult(r); n++;
        delete d[x.tk];   // اتحفظ: يتشال من الفورمة عشان المحاولة الجاية ماتكررهوش
      }
      state.draft={}; state.log.groups=[1]; state.cmp=cmp; state.view="cmp"; render(); scrollTo(0,0);
    }catch(e){toast(n?`اتحفظ ${n} بس، جرّب الباقي`:"ماتحفظش، جرّب تاني");t.disabled=false; if(n) render();}
    finally{ busy.delete("lSave"); }
    return;
  }
  if(t.dataset.addrow!==undefined&&t.dataset.addrow!==""){keepLog();state.log.groups[+t.dataset.addrow]++;render();return;}
  if(t.id==="addGrp"){keepLog();state.log.groups.push(1);render();return;}
  if(t.dataset.rmr){keepLog();const [gi,ri]=t.dataset.rmr.split("-").map(Number),c=state.log,d=state.draft;
    for(let k=ri;k<c.groups[gi]-1;k++){ ["st","d","t"].forEach(f=>{ d[`${f}${gi}_${k}`]=d[`${f}${gi}_${k+1}`]; }); }
    ["st","d","t"].forEach(f=>{ delete d[`${f}${gi}_${c.groups[gi]-1}`]; });
    c.groups[gi]=Math.max(1,c.groups[gi]-1); render(); return;}
  if(t.dataset.rmgrp){keepLog();const gi=+t.dataset.rmgrp,c=state.log,d=state.draft,nd={};
    let g=0; c.groups.forEach((n,i)=>{ if(i===gi) return;
      nd["sw"+g]=d["sw"+i]; for(let ri=0;ri<n;ri++){ ["st","d","t"].forEach(f=>{ if(d[`${f}${i}_${ri}`]!==undefined) nd[`${f}${g}_${ri}`]=d[`${f}${i}_${ri}`]; }); } g++; });
    c.groups.splice(gi,1); if(!c.groups.length) c.groups=[1]; state.draft=nd; render(); return;}
  if(t.dataset.edb){ state.bEdit=t.dataset.edb; render(); return; }
  if(t.id==="beCancel"){ state.bEdit=null; render(); return; }
  if(t.dataset.besave){
    const id=t.dataset.besave, old=state.bench.find(x=>x.id===id); if(!old){state.bEdit=null;render();return;}
    const f=parseTime($("#be-f").value||""), th=parseTime($("#be-th").value||"");
    if(!f&&!th){toast("اكتب وقت الأول أو الثالث");return;}
    if(($("#be-f").value.trim()&&!f)||($("#be-th").value.trim()&&!th)){toast("وقت مش مفهوم");return;}
    { const bd=+$("#be-d").value, bb=timeBad(f,bd)||timeBad(th,bd); if(bb){toast(bb);return;} }
    const nb={...old,age:$("#be-age").value,sex:$("#be-sex").value,pool:+$("#be-pool").value,stroke:$("#be-st").value,dist:+$("#be-d").value,first:f||null,third:th||null};
    delete nb.id;
    const dup=state.bench.find(x=>x.id!==id&&x.age===nb.age&&(x.sex||"m")===nb.sex&&x.dist==nb.dist&&x.stroke===nb.stroke&&(x.pool||50)==nb.pool);
    if(dup){toast("فيه مرجع تاني بنفس الفئة والسباق والحمام");return;}
    t.disabled=true;
    try{ await store.saveBench(nb,id); state.bEdit=null; toast("اتعدّل"); render(); }
    catch(e){ toast("ماتعدّلش، جرّب تاني"); t.disabled=false; }
    return;
  }
  if(t.dataset.delb){ if(await askConfirm("تمسح المرجع ده؟")){try{await store.delBench(t.dataset.delb);toast("اتمسح");}catch(e){toast("ماتمسحش");}} return; }
  if(t.id==="bAddRow"){keepBench();state.bf.n++;render();return;}
  if(t.dataset.rmy){keepBench();const bi=+t.dataset.rmy,c=state.bf,d=state.bdraft;
    for(let k=bi;k<c.n-1;k++){ ["st","d","f","th"].forEach(f=>{ d[f+k]=d[f+(k+1)]; }); }
    ["st","d","f","th"].forEach(f=>{ delete d[f+(c.n-1)]; }); c.n=Math.max(1,c.n-1); render(); return;}
  if(t.id==="bfSave"){
    keepBench(); const c=state.bf, d=state.bdraft||{}; let n=0;
    const rows=[];
    for(let i=0;i<c.n;i++){
      const f=parseTime(d["f"+i]||""), th=parseTime(d["th"+i]||"");
      if(!f&&!th) continue;
      rows.push({meet:c.meet||"",age:c.age,sex:c.sex||"m",pool:+c.pool||50,stroke:d["st"+i]||"free",dist:+(d["d"+i]||50),first:f||null,third:th||null});
    }
    if(!rows.length){toast("اكتب وقت الأول أو الثالث في سباق واحد على الأقل");return;}
    { const bb=rows.map(b=>timeBad(b.first,b.dist)||timeBad(b.third,b.dist)).find(Boolean); if(bb){toast(bb);return;} }
    t.disabled=true;
    try{
      for(const b of rows){
        const ex=state.bench.find(x=>x.age===b.age&&(x.sex||"m")===b.sex&&x.dist==b.dist&&x.stroke===b.stroke&&(x.pool||50)==b.pool);
        await store.saveBench(b,ex?.id); n++;
      }
      state.bdraft={}; c.n=1; toast(`اتحفظ ${n} سباق`); render();
    }catch(e){toast(`اتحفظ ${n} بس، جرّب الباقي`);t.disabled=false;}
    return;
  }
  if(t.dataset.rtab){state.raceTab=t.dataset.rtab;render();scrollTo(0,0);return;}
  if(t.dataset.meet!==undefined){state.meetKey=t.dataset.meet||null;render();scrollTo(0,0);return;}
  if(t.dataset.by){state.meetBy=t.dataset.by;render();return;}
  if(t.dataset.rd){state.relayDist=+t.dataset.rd;render();return;}
  if(t.dataset.rsex){state.relaySex=t.dataset.rsex;render();return;}
  if(t.dataset.rpool){state.relayPool=+t.dataset.rpool;render();return;}
  if(t.dataset.cday){state.cday=+t.dataset.cday;state.view="ccard";render();scrollTo(0,0);return;}
  if(t.dataset.pwho){state.planWho=t.dataset.pwho;render();scrollTo(0,0);return;}
  if(t.dataset.ppday){state.privDay=t.dataset.ppday;render();scrollTo(0,0);return;}
  if(t.dataset.cpday){state.cpDay=t.dataset.cpday;render();scrollTo(0,0);return;}
  if(t.dataset.cpwho){state.cpWho=t.dataset.cpwho;render();scrollTo(0,0);return;}
  if(t.dataset.pday){state.planDay=t.dataset.pday;render();scrollTo(0,0);return;}
  if(t.id==="openCard"){state.view="card";render();scrollTo(0,0);return;}

  db.collection("swimmers").onSnapshot(s=>{state.swimmers=s.docs.map(x=>({id:x.id,...x.data()}));got("swimmers");softRender();},fail);
  db.collection("results").onSnapshot(s=>{state.results=s.docs.map(x=>({id:x.id,...x.data()}));got("results");softRender();},fail);

  db.collection("bench").onSnapshot(s=>{state.bench=s.docs.map(x=>({id:x.id,...x.data()}));got("bench");softRender();},fail);
  db.collection("meets").onSnapshot(s=>{state.meets=s.docs.map(x=>({id:x.id,...x.data()}));got("meets");softRender();},fail);
  db.collection("meas").onSnapshot(s=>{state.meas=s.docs.map(x=>({id:x.id,...x.data()}));got("meas");softRender();},fail);

    /* العلامة إن النقل خلص بتتحط بس لو النقل نجح، عشان لو فشل يسألك تاني */
    const ok=await restore(JSON.stringify(LOCAL));
    if(ok){ try{localStorage.setItem("safwa_moved","1");}catch(x){} }
    ov.remove();
  });
  document.body.appendChild(ov);
}
window.addEventListener("fbauth",e=>{
  if(e.detail){ $("#lg").hidden=true; startCloud(); }
  else { if(STARTED){location.reload();return;}
    /* not signed in after all: drop the saved copy and go back to this phone's own data */
    if(WARM){ WARM=false; mode="local"; loadLocal(); render(); }
    showLogin(); }
});
setTimeout(()=>{ if(!STARTED&&!window.FB) showLogin(); },8000);
setTimeout(()=>{ if(!STARTED&&window.FB&&!("user" in window.FB)){
  const l=$("#lgLoad"); l.textContent="الاتصال بطيء… ";
  const b=document.createElement("button"); b.type="button"; b.className="btn ghost"; b.style.marginTop="10px"; b.textContent="جرّب تاني";
  b.addEventListener("click",()=>location.reload()); l.appendChild(b);
} },7000);
if(window.FB&&("user" in window.FB)){ if(window.FB.user){ $("#lg").hidden=true; startCloud(); } else showLogin(); }
$("#lgForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const er=$("#lgErr"), btn=$("#lgBtn"), em=$("#lgEmail").value.trim(), pw=$("#lgPass").value; er.hidden=true;
  if(!em||!pw){er.textContent="اكتب الإيميل والباسورد";er.hidden=false;return;}
  if(!window.FB){er.textContent="مفيش نت، اتأكد من الاتصال";er.hidden=false;return;}
  btn.disabled=true; btn.textContent="بيدخل…";
  try{ await window.FB.signIn(em,pw); $("#lgPass").value=""; }
  catch(x){ const c=x&&x.code||""; er.textContent=c.includes("too-many")?"محاولات كتير، استنى شوية":c.includes("network")?"مفيش نت، اتأكد من الاتصال":"الإيميل أو الباسورد غلط"; er.hidden=false; }
  btn.disabled=false; btn.textContent="دخول";
});
document.addEventListener("click",e=>{
  const b=e.target.closest("#outBtn"); if(!b) return;
  if(!outArm){outArm=true;b.textContent="متأكد؟ اضغط تاني";setTimeout(()=>{outArm=false;const x=$("#outBtn");if(x)x.textContent="تسجيل خروج";},3000);return;}
  window.FB.signOut();
});
(async()=>{
  if(!window.claude?.use) return;
  try{ sample=await window.claude.use("sample"); if(sample) render(); }catch(e){}
  try{ dl=await window.claude.use("downloads"); }catch(e){}
})();
/* لما النت يقطع أو يرجع، العلامة اللي فوق تتحدّث (من غير ما تبوّظ فورمة بتتكتب) */
addEventListener("online",softRender); addEventListener("offline",softRender);
if("serviceWorker" in navigator)
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
